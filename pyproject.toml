[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "armory"
version = "0.1.0"
description = "Interactive Pentest Payload Dictionary & Knowledge Base"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Armory Contributors"}
]
keywords = ["pentest", "security", "payloads", "xss", "sqli", "tui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "click>=8.1.0",
    "pyyaml>=6.0.1",
    "textual>=0.47.0",
    "anthropic>=0.20.0",
    "pyperclip>=1.8.0",
    "rapidfuzz>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
armory = "armory.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["armory*"]

[tool.setuptools.package-data]
armory = ["data/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
