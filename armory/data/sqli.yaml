    last_updated: '2024-01-01'
  - id: sqli-2ord-005
    title: User preference JSON second-order
    payload_string: '{"theme": "dark'' UNION SELECT password,NULL FROM users --"}'
    how_it_works: 'Applications that store user preferences as JSON and later use preference values in SQL queries (e.g.,
      loading preference-specific content) may be vulnerable to second-order injection via the JSON values. The theme value
      is stored as valid JSON but contains SQL injection. When the application fetches content based on the theme preference
      using a dynamic query, the injected UNION executes. This is a modern variant of second-order injection targeting preference/settings
      features.

      '
    prerequisites:
    - User preference values stored and used in SQL query
    - No re-sanitization on read
    waf_bypass_notes: JSON values stored as-is; WAF may not inspect nested JSON string values
    severity_context: CVSS 7.5 – second-order SQLi via user preferences/settings
    cve_refs: []
    tags:
    - second-order
    - json-preference
    - settings
    - modern-app
    date_added: '2024-01-01'
