  - id: sqli-2ord-009
    title: Second-order SQLi via stored search filter term
    payload_string: laptop%' UNION SELECT null,table_name,null FROM information_schema.tables--
    how_it_works: 'Many applications allow users to save search filters or shopping cart queries that are re-executed when
      the user returns. The stored filter term is retrieved from the database and used to construct a LIKE query. By saving
      a term containing a UNION SELECT statement, the attacker causes the saved-search feature to execute information schema
      queries. The returned table names can be used to map the database schema and identify high-value tables for subsequent
      exfiltration. This is a low-visibility attack because the injection fires as part of normal application functionality
      (loading a saved search) rather than a direct attack request, making detection by intrusion detection systems more difficult.

      '
    prerequisites:
    - Saved search or filter stored and reused in SQL LIKE query
    - Application reflects or processes query results in a way the attacker can observe
    waf_bypass_notes: Percent wildcard encoding combined with UNION obscures intent
    severity_context: CVSS 8.8 – second-order SQLi via saved search LIKE injection
    cve_refs: []
    tags:
    - second-order
    - search-filter
    - saved-search
    - union
    - information-schema
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-2ord-010
    title: Second-order SQLi via stored API key in audit log query
    payload_string: api_key_value' OR 1=1 LIMIT 1000--
    how_it_works: 'Audit logging systems that store API keys and later display usage logs by querying for records matching
      the stored key can be vulnerable to second-order injection. An attacker who can register an API key with embedded SQL
      then requests the audit log for their key; the audit system constructs a WHERE api_key = ''stored_value'' query using
      the stored key without sanitisation. The OR 1=1 clause returns all audit records for all users, potentially leaking
      sensitive operation history. The LIMIT clause prevents overwhelming the result set while still demonstrating the vulnerability.
      This technique is relevant in multi-tenant SaaS platforms where audit logs contain cross-tenant data guarded only by
      the API key filter.

      '
    prerequisites:
    - Audit log query uses stored API key value in WHERE clause without parameterisation
    - Audit table contains cross-user or cross-tenant records
    waf_bypass_notes: API key fields are rarely inspected by WAF for SQL patterns
    severity_context: CVSS 8.8 – second-order SQLi via API key in audit log query
    cve_refs: []
    tags:
    - second-order
    - api-key
    - audit-log
    - or-tautology
    - multi-tenant
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
- slug: nosql
  name: NoSQL Injection
  description: Attacks targeting NoSQL databases (MongoDB, CouchDB, Redis) by manipulating query operators, injecting server-side
    JavaScript, or abusing query structure.
  difficulty: medium
  prerequisites:
  - Application uses a NoSQL database (MongoDB, CouchDB, Redis)
  - User input incorporated into database queries without sanitization
  payloads:
  - id: sqli-nosql-001
    title: MongoDB operator injection authentication bypass
    payload_string: '{"username": {"$gt": ""}, "password": {"$gt": ""}}'
    how_it_works: 'MongoDB query operators like $gt (greater than) can be injected when the application accepts JSON or constructs
      queries from user-supplied objects. The $gt: "" condition matches any non-empty string, effectively making both the
      username and password conditions true for any user. This bypasses authentication by returning the first user record
      regardless of credential validity. In Express.js applications that pass req.body directly to Mongoose queries, this
      is a common vulnerability.

      '
    prerequisites:
    - MongoDB backend with Mongoose or native driver
    - Application passes user-supplied JSON to find() or findOne()
    waf_bypass_notes: WAFs rarely inspect MongoDB operator injection; target JSON bodies
    severity_context: CVSS 9.8 – authentication bypass via MongoDB query operator injection
    cve_refs:
    - CVE-2013-4650
    tags:
    - nosql
    - mongodb
    - operator-injection
    - auth-bypass
    - json-body
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-nosql-002
    title: MongoDB $where JavaScript injection
    payload_string: '''; return true; //'
    how_it_works: 'MongoDB''s $where operator allows JavaScript expressions to be evaluated server-side for document filtering.
      If user input is incorporated into a $where query without sanitization, arbitrary JavaScript executes on the MongoDB
      server. Injecting a return true; statement makes the query match all documents. More sophisticated payloads use sleep()
      for time-based blind injection or access file system APIs. Server-side JavaScript execution is disabled by default in
      MongoDB 4.4+ but remains in legacy deployments.

      '
    prerequisites:
    - MongoDB with server-side JavaScript enabled
    - Application uses $where with user input
    waf_bypass_notes: $where is disabled in modern MongoDB; target legacy deployments
    severity_context: CVSS 8.8 – server-side JavaScript execution in MongoDB via $where
    cve_refs:
    - CVE-2013-4650
    tags:
    - nosql
    - mongodb
    - where-injection
    - js-execution
    - legacy
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-nosql-003
    title: MongoDB $regex injection for enumeration
    payload_string: '{"username": "admin", "password": {"$regex": "^a"}}'
    how_it_works: 'MongoDB''s $regex operator enables regular expression matching. By injecting $regex as the password comparison
      operator, the attacker tests whether the password starts with a specific character pattern. Starting with ''^a'', then
      ''^b'', etc., the attacker performs a character-by-character brute force of the password — analogous to boolean blind
      SQL injection. Each request reveals one character. This technique works against any application that passes user-supplied
      query operators to MongoDB.

      '
    prerequisites:
    - MongoDB backend
    - Application passes JSON body to database query
    - Authentication endpoint returns different responses for valid/invalid credentials
    waf_bypass_notes: Observable response difference required; works like boolean blind SQLi
    severity_context: CVSS 7.5 – character-by-character password extraction via MongoDB regex
    cve_refs:
    - CVE-2013-4650
    tags:
    - nosql
    - mongodb
    - regex-injection
    - blind-extraction
    - boolean-blind
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-nosql-004
    title: PHP MongoDB array injection
    payload_string: username=admin&password[$ne]=wrongpassword
    how_it_works: 'In PHP applications, query string parameters can encode arrays using bracket notation. password[$ne]=wrongpassword
      constructs a MongoDB query condition {password: {$ne: ''wrongpassword''}}, which matches any user whose password is
      not ''wrongpassword'' — i.e., any user at all. Combined with a valid username, this retrieves the admin user''s record,
      bypassing authentication. This is the URL-encoded form of the JSON operator injection and affects PHP applications using
      $_GET or $_POST with MongoDB drivers.

      '
    prerequisites:
    - PHP application with MongoDB backend
    - PHP allows array notation in query parameters
    - Application uses $_GET/$_POST directly in MongoDB query
    waf_bypass_notes: URL parameter array notation; WAFs may not parse PHP array bracket syntax
    severity_context: CVSS 9.8 – PHP array notation MongoDB auth bypass
    cve_refs:
    - CVE-2013-4650
    tags:
    - nosql
    - mongodb
    - php-array
    - url-injection
    - auth-bypass
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-nosql-005
    title: Redis command injection via CRLF
    payload_string: "key\r\nSET admin_password hacked\r\n"
    how_it_works: 'Redis uses a text-based protocol (RESP) where commands are separated by CRLF sequences. If a Redis key
      or command parameter contains CRLF characters that are passed unsanitized to the Redis connection, the CRLF sequences
      inject new Redis commands. In this example, a SET command overwrites the admin password. This requires that the application
      passes user-supplied data to Redis commands without stripping CRLF characters. It is a protocol-level injection rather
      than a query language injection.

      '
    prerequisites:
    - Application passes user input to Redis commands
    - CRLF characters not stripped from Redis parameters
    - Redis accessible without authentication or with known auth
    waf_bypass_notes: CRLF injection in Redis protocol; %0d%0a URL encoding
    severity_context: CVSS 8.8 – Redis CRLF injection for arbitrary command execution
    cve_refs:
    - CVE-2022-0543
    tags:
    - nosql
    - redis
    - crlf-injection
    - protocol-injection
    - command-injection
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-nosql-006
    title: CouchDB MapReduce JavaScript injection
    payload_string: function(doc){ if(doc._id == 'admin') { emit(doc._id, doc); }}
    how_it_works: 'CouchDB uses JavaScript-based MapReduce views for querying. If a user-supplied design document or view
      function is accepted by the application, arbitrary JavaScript executes on the CouchDB server. An attacker can access
      all documents in the database by emitting them, perform server-side operations, or attempt to access the file system
      via Node.js APIs (in vulnerable configurations). This requires the ability to create or modify CouchDB design documents.

      '
    prerequisites:
    - CouchDB backend
    - Attacker can create or modify design documents
    - Application passes user-supplied view functions to CouchDB
    waf_bypass_notes: JavaScript function injection; specific to CouchDB admin interfaces
    severity_context: CVSS 8.5 – CouchDB MapReduce JavaScript execution for data access
    cve_refs: []
    tags:
    - nosql
    - couchdb
    - mapreduce
    - js-injection
    - design-document
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-nosql-007
    title: MongoDB $where Operator Arbitrary JavaScript Execution
    payload_string: '{"$where": "function() { return this.password.match(/^a/); }"}

      '
    encoding: none
    how_it_works: 'MongoDB''s $where operator accepts a JavaScript function string and evaluates it server-side against each
      document in the collection, enabling arbitrary logic execution. An attacker can inject boolean-returning functions to
      enumerate field values character by character (blind extraction) or execute time-delay functions for timing-based confirmation.
      Modern MongoDB versions disable $where by default; legacy deployments and misconfigured instances remain vulnerable,
      particularly where the JS engine is not restricted.

      '
    context_of_use: MongoDB query parameters passed without sanitization
    requires:
    - MongoDB with server-side JS enabled ($where not disabled)
    - Application reflects or behaves differently based on query result
    waf_bypass_notes: Obfuscate via Unicode escapes in JS string; split function across encoded fields
    severity_context: CVSS 8.1 – arbitrary JS execution enabling blind field enumeration and data theft
    cve_refs:
    - CVE-2013-4650
    tags:
    - nosql
    - mongodb
    - where-js
    - blind-extraction
    - server-side-js
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-nosql-008
    title: Redis EVAL Lua Script Injection via Cached Key
    payload_string: 'EVAL "return redis.call(''keys'',''*'')" 0

      '
    encoding: none
    how_it_works: 'Redis exposes a Lua scripting interface via the EVAL command that executes scripts atomically in the Redis
      engine, bypassing ACL restrictions on individual commands. When an application constructs Redis commands from user input
      without sanitization, an attacker can inject EVAL with a Lua payload to enumerate keys, read arbitrary key values, or
      abuse redis.call() to chain privileged operations against the datastore. This is distinct from SSRF-based Redis attacks;
      here the injection is within the application''s Redis client command construction pipeline.

      '
    context_of_use: Applications building raw Redis command strings from user input
    requires:
    - Redis accessible by application with EVAL not disabled via rename-command
    - User input reaches Redis command construction without sanitization
    waf_bypass_notes: Encode Lua string in hex literals; split across multiple EVAL calls
    severity_context: CVSS 8.8 – full keyspace enumeration and arbitrary data read/write
    cve_refs:
    - CVE-2022-0543
    tags:
    - nosql
    - redis
    - lua-injection
    - eval
    - command-injection
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-nosql-009
    title: MongoDB $regex Operator Blind Field Enumeration
    payload_string: '{"username": "admin", "password": {"$regex": "^a"}}

      '
    encoding: none
    how_it_works: 'MongoDB''s $regex operator enables pattern matching within query predicates. By iterating the regex anchor
      character by character (^a, ^ab, ^abc …), an attacker can determine the exact value of a field through boolean-blind
      enumeration based on whether the query returns a result or not. This technique is effective against login endpoints
      that reflect authentication success or failure, allowing full password (or secret field) extraction without triggering
      brute-force thresholds that count distinct attempts rather than regex variations.

      '
    context_of_use: MongoDB-backed login or search endpoints accepting JSON body parameters
    requires:
    - Application passes unsanitized JSON keys to MongoDB query
    - Observable boolean difference in application response
    waf_bypass_notes: Encode $ as %24 in URL parameters; use nested $options for case-insensitive enumeration
    severity_context: CVSS 7.5 – blind field value extraction through response timing or boolean differences
    cve_refs:
    - CVE-2013-4650
    tags:
    - nosql
    - mongodb
    - regex-blind
    - operator-injection
    - enumeration
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-nosql-010
    title: MongoDB $ne Operator Authentication Bypass
    payload_string: '{"username": "admin", "password": {"$ne": "invalid_value_xyz"}}

      '
    encoding: none
    how_it_works: 'MongoDB''s $ne (not-equal) comparison operator injected into a password field causes the query predicate
      to evaluate as true for any stored password that is not equal to the supplied dummy value, effectively bypassing password
      verification entirely. This attack requires the application to pass JSON body parameters directly into a MongoDB find()
      or findOne() query without stripping operator keys. It is one of the most reliable NoSQL authentication bypasses because
      the $ne operator is universally supported across MongoDB versions and requires no server-side JS.

      '
    context_of_use: MongoDB-backed authentication endpoints accepting JSON request bodies
    requires:
    - Application constructs MongoDB query directly from parsed JSON body
    - No input sanitization to strip $ prefixed keys
    waf_bypass_notes: URL-encode $ as %24 for form-data submissions; nest inside $or for complex bypasses
    severity_context: CVSS 9.1 – authentication bypass granting unauthorized admin access
    cve_refs:
    - CVE-2013-4650
    tags:
    - nosql
    - mongodb
    - ne-operator
    - auth-bypass
    - operator-injection
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
