  - id: sqli-2ord-006
    title: Second-order SQLi via avatar/image URL stored field
    payload_string: https://attacker.com/img.png' OR '1'='1
    how_it_works: 'Applications that store an image URL in a user profile and later construct SQL queries using that URL are
      vulnerable to second-order SQL injection. The malicious SQL is stored as part of the URL string during registration
      or profile update, appearing harmless at that stage since it is not used in a query immediately. When an administrator
      or reporting module later queries the database using the stored URL as a WHERE clause parameter, the injected OR condition
      fires. This pattern is particularly common in content management systems that aggregate user media URLs for reporting
      or batch operations. The attacker gains the ability to manipulate query results or exfiltrate data from the reporting
      context.

      '
    prerequisites:
    - User-supplied URL stored in database without parameterisation
    - Stored URL used in subsequent SQL query without re-encoding
    waf_bypass_notes: WAF does not inspect stored database values used in later queries
    severity_context: CVSS 8.8 – second-order SQLi via stored avatar URL field
    cve_refs: []
    tags:
    - second-order
    - url-field
    - avatar
    - profile
    - stored
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-2ord-007
    title: Second-order SQLi in scheduled report generation
    payload_string: Monthly Report'; INSERT INTO admin_accounts VALUES('hacker','hash')--
    how_it_works: 'Scheduled report generation systems often store report names, filter parameters, or recipient lists provided
      by users, then use those stored values to construct SQL queries when the scheduler fires. An attacker who can set a
      report name or parameter containing SQL injects malicious statements that execute with the scheduler''s database permissions,
      often higher than normal user permissions. The injected INSERT creates a new admin account, providing persistent access.
      This class of attack is particularly dangerous because the payload may execute hours or days after injection, making
      forensic correlation more difficult, and because report schedulers frequently run with elevated database roles.

      '
    prerequisites:
    - Report scheduler uses stored user-provided values in SQL without parameterisation
    - Scheduler's database role has INSERT/UPDATE privileges on sensitive tables
    waf_bypass_notes: Scheduler execution context not inspected by runtime WAF
    severity_context: CVSS 9.0 – second-order SQLi in scheduler leading to privilege escalation
    cve_refs: []
    tags:
    - second-order
    - scheduler
    - report
    - insert
    - privilege-escalation
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-2ord-008
    title: Second-order SQLi via stored email address in notification template
    payload_string: victim@example.com' UNION SELECT password,2,3 FROM users--
    how_it_works: 'Email notification systems that dynamically query recipient details using stored email addresses can be
      exploited when the stored email is used unsafely in SQL. An attacker registers with a maliciously crafted email address;
      when the notification system later builds a query to fetch display name or preferences using the stored email, the UNION
      SELECT clause appends an additional result set. The results may be included in the notification content or logged, leaking
      password hashes or other sensitive columns. This attack relies on the notification system having SELECT access to the
      users table, which is typical for systems that look up display names for personalised messages.

      '
    prerequisites:
    - Notification system queries database using stored email without parameterisation
    - users table accessible to the notification module's database user
    waf_bypass_notes: Email field validation may block angle brackets but not SQL keywords
    severity_context: CVSS 8.8 – second-order SQLi via email field in notification query
    cve_refs: []
    tags:
    - second-order
    - email
