  - id: sqli-time-006
    title: MySQL BENCHMARK delay
    payload_string: ''' AND BENCHMARK(5000000,MD5(1)) --'
    how_it_works: 'MySQL''s BENCHMARK(count, expr) function repeats an expression a specified number of times, creating CPU
      load that translates to measurable delay. Unlike SLEEP() which is often WAF-blocked, BENCHMARK uses a different function
      name. Performing 5 million MD5 hash computations introduces a delay of approximately 2-5 seconds depending on server
      hardware. The delay is hardware-dependent, making precise timing harder, but it is an effective SLEEP() alternative
      when SLEEP is blocked.

      '
    prerequisites:
    - MySQL or MariaDB database
    - BENCHMARK not blocked
    waf_bypass_notes: BENCHMARK bypasses WAFs that only block SLEEP; adjust count for timing
    severity_context: CVSS 7.5 – CPU-based delay via MySQL BENCHMARK as SLEEP bypass
    cve_refs: []
