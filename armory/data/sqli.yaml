  - id: sqli-time-005
    title: Oracle heavy query delay
    payload_string: ''' AND 1=(SELECT count(*) FROM all_objects a, all_objects b) --'
    how_it_works: 'Oracle does not have a built-in sleep function accessible without special privileges. Instead, a heavy
      query that performs a large Cartesian join can introduce significant delays. Selecting from all_objects (which contains
      thousands of rows) joined with itself creates a cross-product with millions of rows, taking several seconds to execute.
      The delay is dependent on the number of objects in the database. This technique is less precise than SLEEP but is effective
      in Oracle environments without UTL_HTTP access.

      '
    prerequisites:
    - Oracle Database
    - Read access to all_objects view
    waf_bypass_notes: Heavy query; no sleep keyword; bypasses keyword-based WAF rules
    severity_context: CVSS 6.5 – Oracle time delay via heavy Cartesian query
