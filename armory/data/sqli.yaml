slug: sqli
name: SQL Injection
owasp: A03:2021 – Injection
description: 'SQL Injection occurs when user-supplied data is incorporated into a SQL query without proper parameterization
  or sanitization, allowing an attacker to manipulate the query''s logic. Successful exploitation can lead to unauthorized
  data disclosure, authentication bypass, data manipulation, and in some configurations, remote code execution via database
  features. It remains one of the most critical and widespread web application vulnerabilities.

  '
severity_range:
  low: CVSS 6.5
  high: CVSS 9.8
references:
- label: OWASP SQL Injection Prevention Cheat Sheet
  url: https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
- label: PortSwigger SQL Injection Research
  url: https://portswigger.net/web-security/sql-injection
- label: PayloadsAllTheThings SQLi
  url: https://github.com/swisskyrepo/PayloadsAllTheThings/tree/master/SQL%20Injection
groups:
- slug: error-based
  name: Error-Based SQL Injection
  description: Forces the database to return error messages containing query results, allowing data extraction through verbose
    error output.
  difficulty: low
  prerequisites:
  - Application reflects database error messages to the user
  - Error verbosity enabled in the database or application
  payloads:
  - id: sqli-err-001
    title: Basic single quote error trigger
    payload_string: ''''
    how_it_works: 'Inserting a single apostrophe into a string-based SQL parameter breaks the string delimiter, causing an
      unmatched quote in the SQL query. Most databases return a syntax error message that reveals the database type, version,
      and partial query structure. This is the fundamental SQL injection probe used to confirm that a parameter is injectable.
      The error message itself provides reconnaissance data for crafting more advanced exploitation payloads.

      '
    prerequisites:
    - Parameter used in SQL string comparison
    - Application returns database errors to user
    waf_bypass_notes: WAFs detect lone single quotes; use %27 URL encoding as alternative
    severity_context: CVSS 5.3 – confirms SQL injection, reveals database info
    cve_refs:
    - CVE-2022-0739
    tags:
    - error-based
    - probe
    - basic
    - string-injection
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-err-002
    title: MySQL extractvalue error-based
    payload_string: 1 AND extractvalue(1,concat(0x7e,(SELECT version())))
    how_it_works: 'MySQL''s extractvalue() function performs an XPath query on an XML document. When the XPath expression
      is invalid, MySQL generates an error message that includes the invalid expression value. By placing a subquery inside
      concat() as part of the XPath argument, the subquery result appears in the error message. This is a standard MySQL error-based
      extraction technique that returns one row per injection. The 0x7e hex value is the tilde character, used as a delimiter
      to identify the extracted data.

      '
    prerequisites:
    - MySQL 5.1+ database
    - Application reflects SQL errors
    waf_bypass_notes: Replace version() with other queries; use hex encoding for strings
    severity_context: CVSS 7.5 – extracts arbitrary database data via error messages
    cve_refs:
    - CVE-2014-6300
    tags:
    - error-based
    - mysql
    - extractvalue
    - xpath
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-err-003
    title: MySQL updatexml error-based
    payload_string: 1 AND updatexml(1,concat(0x7e,(SELECT database())),1)
    how_it_works: 'MySQL''s updatexml() function updates XML content in a field. When provided with an invalid XPath expression,
      it raises a 1105 error that includes the invalid expression in the error message. The subquery inside concat() with
      a tilde prefix causes the queried database name to appear in the error. This technique is useful when extractvalue is
      filtered, providing an alternative error channel. It works on MySQL 5.1+ and returns data limited to 32 characters per
      call.

      '
    prerequisites:
    - MySQL 5.1+ database
    - Error messages returned to user
    waf_bypass_notes: Alternate to extractvalue; use when extractvalue is WAF-blocked
    severity_context: CVSS 7.5 – database name/data extraction via XML error
    cve_refs:
    - CVE-2014-6300
    tags:
    - error-based
    - mysql
    - updatexml
    - xpath-error
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-err-004
    title: MSSQL convert error-based
    payload_string: 1 AND 1=CONVERT(int,(SELECT TOP 1 table_name FROM information_schema.tables))
    how_it_works: 'SQL Server''s CONVERT function, when asked to convert a string to an integer, raises a conversion error
      that includes the string value being converted. By placing a subquery as the value to convert, the query result appears
      in the error message. This is the classic MSSQL error-based extraction technique. It extracts the first table name from
      information_schema.tables and reveals it in the SQL Server error message returned to the application.

      '
    prerequisites:
    - Microsoft SQL Server
    - Application returns SQL Server error messages
    waf_bypass_notes: Use CAST() as alternative; try different data type targets
    severity_context: CVSS 7.5 – schema enumeration via SQL Server type conversion error
    cve_refs:
    - CVE-2023-34362
    tags:
    - error-based
    - mssql
    - convert
    - type-conversion
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-err-005
    title: Oracle UTL_INADDR error-based
    payload_string: 1 AND 1=utl_inaddr.get_host_name((SELECT user FROM dual))
    how_it_works: 'Oracle''s UTL_INADDR package performs network hostname lookups. When provided with an invalid hostname
      (such as a database query result), it raises an ORA-29257 error including the invalid hostname string. The queried value
      (current Oracle user in this case) appears in the error message. This technique requires EXECUTE privilege on UTL_INADDR.
      It is particularly useful in Oracle environments where other error-based techniques do not apply.

      '
    prerequisites:
    - Oracle Database
    - Execute privilege on UTL_INADDR
    - Application reflects Oracle errors
    waf_bypass_notes: Requires UTL_INADDR privilege; try XMLType error method as alternative
    severity_context: CVSS 7.5 – Oracle user enumeration via network function error
    cve_refs: []
    tags:
    - error-based
    - oracle
    - utl_inaddr
    - dns-based
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-err-006
    title: PostgreSQL cast error-based
    payload_string: 1 AND 1=CAST((SELECT version()) AS INTEGER)
    how_it_works: 'PostgreSQL''s CAST operator, when converting a non-numeric string to INTEGER, raises an ERROR including
      the value that could not be cast. The subquery result (database version string) appears directly in the PostgreSQL error
      message. This is the primary error-based technique for PostgreSQL. The error message format is consistent across PostgreSQL
      versions, making this a reliable extraction method when verbose errors are enabled.

      '
    prerequisites:
    - PostgreSQL database
    - Application reflects PostgreSQL error messages
    waf_bypass_notes: 'Use ::integer cast syntax as alternative: (SELECT version())::integer'
    severity_context: CVSS 7.5 – PostgreSQL version/data extraction via cast error
    cve_refs: []
    tags:
    - error-based
    - postgresql
    - cast
    - type-error
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-err-007
    title: MySQL floor rand error-based
    payload_string: 1 AND (SELECT 1 FROM (SELECT count(*),concat((SELECT database()),floor(rand(0)*2))x FROM information_schema.tables
      GROUP BY x)a)
    how_it_works: 'This classic MySQL error-based technique exploits a race condition in GROUP BY with rand(). The floor(rand(0)*2)
      expression is evaluated twice per row due to MySQL''s optimizer behavior, causing duplicate key errors in the temporary
      table. The error message includes the concat value which contains the subquery result. This technique works in MySQL
      versions prior to fixes addressing the non-deterministic function issue. It is particularly useful when extractvalue/updatexml
      are filtered.

      '
    prerequisites:
    - MySQL database (pre-fix versions; may vary by version)
    - Application reflects SQL errors
    waf_bypass_notes: Complex query structure; obfuscate with whitespace and comments
    severity_context: CVSS 7.5 – MySQL race condition error extraction technique
    cve_refs:
    - CVE-2014-6300
    tags:
    - error-based
    - mysql
    - floor-rand
    - group-by
    - race-condition
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-err-008
    title: MSSQL XP_CMDSHELL via error
    payload_string: '''; EXEC xp_cmdshell(''whoami''); --'
    how_it_works: 'xp_cmdshell is an extended stored procedure in Microsoft SQL Server that executes operating system commands
      and returns the output. If enabled (disabled by default in SQL Server 2005+), an attacker with sysadmin privileges or
      appropriate permissions can execute arbitrary OS commands on the database server. The semicolon terminates the prior
      SQL statement, xp_cmdshell executes the command, and the double-dash comment suppresses any trailing SQL. This escalates
      SQLi to Remote Code Execution.

      '
    prerequisites:
    - Microsoft SQL Server with xp_cmdshell enabled
    - Database user has sysadmin or EXECUTE permission
    - Stacked queries supported
    waf_bypass_notes: xp_cmdshell is blocked by WAFs; use hex encoding or char() function
    severity_context: CVSS 9.8 – SQL injection to OS command execution via MSSQL
    cve_refs: []
    tags:
    - error-based
    - mssql
    - xp_cmdshell
    - rce
    - os-command
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-err-009
    title: MySQL load_file error disclosure
    payload_string: 1 AND extractvalue(1,concat(0x7e,load_file('/etc/passwd')))
    how_it_works: 'MySQL''s load_file() function reads the contents of a file from the server''s filesystem. When used inside
      an error-based extraction technique like extractvalue, the file contents appear in the error message. This allows reading
      arbitrary files from the database server if the MySQL process has read permission. The FILE privilege is required for
      the database user. Reading /etc/passwd reveals system user accounts; more sensitive targets include application config
      files and SSH keys.

      '
    prerequisites:
    - MySQL database with FILE privilege
    - secure_file_priv not restricting file access
    - Application reflects SQL errors
    waf_bypass_notes: 'load_file is often WAF-blocked; use hex path: load_file(0x2f6574632f706173737764)'
    severity_context: CVSS 8.6 – arbitrary file read from database server via MySQL
    cve_refs: []
    tags:
    - error-based
    - mysql
    - load_file
    - file-read
    - lfi
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-err-010
    title: SQLite error-based via json_extract
    payload_string: 1 AND json_extract('{"x":1}', '$.'+sqlite_version())
    how_it_works: 'SQLite''s json_extract function returns an error when given an invalid JSON path expression. By concatenating
      the result of a subquery (like sqlite_version()) into the path argument, the error message reveals the version string.
      SQLite is common in mobile backends and embedded applications. This error-based technique requires that the application
      reflect SQLite error messages. SQLite''s simplicity means fewer built-in error extraction functions compared to enterprise
      databases.

      '
    prerequisites:
    - SQLite database
    - Application reflects SQLite error messages
    - SQLite version 3.9+ with JSON1 extension
    waf_bypass_notes: SQLite-specific; WAF rules often target MySQL/MSSQL patterns
    severity_context: CVSS 6.5 – SQLite version and data extraction via JSON error
    cve_refs: []
    tags:
    - error-based
    - sqlite
    - json-extract
    - mobile-backend
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
- slug: boolean-blind
  name: Boolean-Based Blind SQL Injection
  description: Infers database contents by asking true/false questions that change the application's observable behavior (different
    responses for true vs. false conditions).
  difficulty: medium
  prerequisites:
  - Application response differs based on query truth value
  - No error messages returned to user
  payloads:
  - id: sqli-bool-001
    title: Classic OR 1=1 / AND 1=2 probe
    payload_string: ''' OR ''1''=''1'
    how_it_works: 'This payload appends a tautology (always-true condition) to a WHERE clause string comparison. When injected,
      the WHERE clause becomes: WHERE field=''value'' OR ''1''=''1'', which evaluates to true for every row, returning all
      records. Comparing the response to a normal request and a false-condition request ('' OR ''1''=''2) reveals boolean
      behavior. If the responses differ, the parameter is boolean-injectable and can be exploited for blind data extraction.
      This is also a classic authentication bypass vector.

      '
    prerequisites:
    - Parameter used in SQL WHERE clause string comparison
    - Application returns different results for true vs false conditions
    waf_bypass_notes: Classic payload; use '%27 OR %271%27=%271' URL encoding
    severity_context: CVSS 7.5 – authentication bypass and boolean blind probe
    cve_refs: []
    tags:
    - boolean-blind
    - tautology
    - auth-bypass
    - probe
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-bool-002
    title: Substring binary extraction
    payload_string: ''' AND (SELECT SUBSTRING(password,1,1) FROM users WHERE username=''admin'')=''a'' --'
    how_it_works: 'This payload extracts a single character from the admin user''s password by testing if the first character
      equals ''a''. The application responds differently for true vs false conditions (different content, redirect, or HTTP
      status). An attacker iterates through all possible characters for each position, sending one request per character per
      position. This binary search can extract entire field values. Tools like SQLMap automate this process with optimized
      character search algorithms.

      '
    prerequisites:
    - Boolean condition causes observable response difference
    - users table with username and password columns (or guessable schema)
    waf_bypass_notes: Slow extraction; use binary search logic to reduce requests
    severity_context: CVSS 8.5 – extracts password character-by-character from database
    cve_refs: []
    tags:
    - boolean-blind
    - data-extraction
    - substring
    - character-brute
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-bool-003
    title: ASCII binary comparison
    payload_string: ''' AND ASCII(SUBSTRING((SELECT database()),1,1))>64 --'
    how_it_works: 'By comparing the ASCII code of individual characters to threshold values, an attacker can perform a binary
      search to extract each character in log2(128)=7 requests instead of 128. The ASCII() function returns the numeric code
      of the first character; comparing to 64 distinguishes uppercase letters from other characters. This efficient approach
      reduces the total number of requests needed to extract data, making blind SQLi more practical. The database name is
      extracted one character at a time.

      '
    prerequisites:
    - MySQL or compatible database
    - Observable boolean response difference
    waf_bypass_notes: Binary search reduces request count; helps avoid rate limiting
    severity_context: CVSS 7.5 – efficient character extraction via ASCII binary search
    cve_refs: []
    tags:
    - boolean-blind
    - ascii
    - binary-search
    - efficient
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-bool-004
    title: CASE WHEN conditional
    payload_string: ''' AND (CASE WHEN (1=1) THEN 1 ELSE 0 END)=1 --'
    how_it_works: 'The CASE WHEN expression allows conditional logic in SQL that returns different values based on a condition.
      This payload tests a simple tautology (1=1) to confirm boolean injection behavior. For actual extraction, the condition
      would be replaced with a subquery comparing extracted characters to known values. CASE WHEN is supported across MySQL,
      MSSQL, PostgreSQL, and Oracle, making it a database-agnostic blind injection technique.

      '
    prerequisites:
    - SQL injection in any major RDBMS
    - Observable boolean response difference
    waf_bypass_notes: Database-agnostic; use whitespace variations to evade WAF
    severity_context: CVSS 7.5 – cross-database boolean condition injection
    cve_refs: []
    tags:
    - boolean-blind
    - case-when
    - cross-database
    - conditional
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-bool-005
    title: IF() function extraction (MySQL)
    payload_string: ''' AND IF((SELECT count(*) FROM users)>0,1,0)=1 --'
    how_it_works: 'MySQL''s IF(condition, true_value, false_value) function provides a ternary operator in SQL. When used
      in boolean blind injection, a true condition returns 1 (making the outer comparison true) and a false condition returns
      0 (making it false). This payload confirms whether the users table exists and has records. The IF function is more readable
      than nested CASE WHEN expressions and is specific to MySQL/MariaDB syntax.

      '
    prerequisites:
    - MySQL or MariaDB database
    - Observable boolean response
    waf_bypass_notes: IF() is MySQL-specific; replace with CASE WHEN for other databases
    severity_context: CVSS 7.5 – MySQL IF-based table existence confirmation
    cve_refs: []
    tags:
    - boolean-blind
    - mysql
    - if-function
    - table-enumeration
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-bool-006
    title: Conditional error boolean (MSSQL)
    payload_string: '''; IF (SELECT count(*) FROM sys.tables WHERE name=''users'')>0 WAITFOR DELAY ''0:0:5'' --'
    how_it_works: 'This hybrid boolean/time-based technique in MSSQL uses IF to branch: if the condition is true, a WAITFOR
      DELAY introduces a measurable time delay; if false, the query returns immediately. By measuring response time, the attacker
      infers the boolean result. It first confirms that the users table exists. Subsequent queries extract schema and data.
      WAITFOR DELAY is preferred over SLEEP (MySQL) in MSSQL environments.

      '
    prerequisites:
    - Microsoft SQL Server
    - Stacked queries supported
    - Response time measurable by attacker
    waf_bypass_notes: WAITFOR DELAY is commonly WAF-blocked; consider alternate delay methods
    severity_context: CVSS 7.5 – MSSQL conditional time-boolean hybrid for schema enumeration
    cve_refs: []
    tags:
    - boolean-blind
    - mssql
    - waitfor
    - hybrid-time
    - schema-enum
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-bool-007
    title: Boolean injection in cookie parameter
    payload_string: trackingId=abc' AND '1'='1
    how_it_works: 'SQL injection vulnerabilities often exist in non-obvious parameter locations such as cookies. Tracking
      cookies, session IDs passed as custom cookies, and preference cookies may be used in SQL queries without proper parameterization.
      By injecting a boolean condition into a cookie value, the attacker can test for SQL injection in a location that may
      not be guarded by WAF rules focused on GET/POST parameters. Different page content for true vs. false confirms injection.

      '
    prerequisites:
    - Cookie value used in SQL query
    - Cookie value not parameterized
    waf_bypass_notes: Cookie parameters often have weaker WAF inspection than query params
    severity_context: CVSS 7.5 – SQLi in cookie parameter, commonly overlooked
    cve_refs: []
    tags:
    - boolean-blind
    - cookie-injection
    - non-obvious-vector
    - parameter-location
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-bool-008
    title: JSON field boolean injection
    payload_string: '{"username": "admin'' AND ''1''=''1", "password": "x"}'
    how_it_works: 'Modern web applications that accept JSON request bodies may pass JSON field values directly into SQL queries.
      If the username field value is incorporated into a SQL WHERE clause without parameterization, injecting boolean logic
      into the JSON field value achieves SQL injection. WAF rules focused on URL parameters or form fields may not inspect
      JSON request bodies with the same rigor. This is a common oversight in REST APIs.

      '
    prerequisites:
    - JSON API endpoint passes field values to SQL
    - No parameterized queries for JSON-sourced values
    waf_bypass_notes: JSON body injection may bypass WAFs configured for form parameters
    severity_context: CVSS 8.5 – SQL injection via JSON request body
    cve_refs: []
    tags:
    - boolean-blind
    - json-injection
    - rest-api
    - body-injection
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-bool-009
    title: Second-order boolean extraction
    payload_string: admin'--
    how_it_works: 'A second-order SQL injection occurs when user input is safely stored but later retrieved and used in a
      new SQL query without parameterization. The payload stores the value ''admin''--'' in a registration field. When the
      application later retrieves and uses this value (e.g., in a profile update query), the injected SQL comment truncates
      the query. If the truncated query performs a different action than intended, the attacker can infer boolean conditions
      from the application''s behavior.

      '
    prerequisites:
    - Application stores input safely but uses it unsafely in subsequent queries
    - Observable behavior difference in downstream functionality
    waf_bypass_notes: Second-order injection is stored at write time; WAF may miss the trigger
    severity_context: CVSS 7.5 – second-order injection via stored credentials
    cve_refs: []
    tags:
    - boolean-blind
    - second-order
    - stored
    - deferred-injection
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-bool-010
    title: Boolean with ORDER BY inference
    payload_string: 1 ORDER BY (CASE WHEN (1=1) THEN name ELSE id END)
    how_it_works: 'When injecting into an ORDER BY clause, boolean conditions can change the sort order of results. A true
      condition sorts by one column; a false condition sorts by a different column. If results appear in a predictable order,
      the attacker infers boolean truth by observing which record appears first. This technique works when other boolean injection
      methods fail because ORDER BY injection has different parsing context than WHERE clause injection. It is a less commonly
      tested vector.

      '
    prerequisites:
    - Injection point is in ORDER BY clause
    - Result ordering is observable and predictable
    waf_bypass_notes: ORDER BY injection context is often missed by automated scanners
    severity_context: CVSS 6.5 – boolean inference via ORDER BY column switching
    cve_refs: []
    tags:
    - boolean-blind
    - order-by
    - column-inference
    - non-standard-context
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
- slug: time-based
  name: Time-Based Blind SQL Injection
  description: Infers database contents by injecting conditional time delays — queries that pause execution if a condition
    is true, measured by the attacker.
  difficulty: medium
  prerequisites:
  - No visible response difference between true and false conditions
  - Response time measurable by attacker
  - Database supports time delay functions
  payloads:
  - id: sqli-time-001
    title: MySQL SLEEP basic probe
    payload_string: ''' AND SLEEP(5) --'
    how_it_works: 'MySQL''s SLEEP(n) function pauses execution for n seconds. When injected as a boolean condition, the query
      delays the response by 5 seconds if evaluated (i.e., if the injection was successful). Comparing normal response time
      to the delayed response confirms time-based blind SQL injection. No response content change is needed — only the timing
      difference matters. This is the first step in time-based blind exploitation.

      '
    prerequisites:
    - MySQL or MariaDB database
    - HTTP timeout not shorter than sleep duration
    waf_bypass_notes: SLEEP() is commonly WAF-blocked; use BENCHMARK() or custom delays
    severity_context: CVSS 7.5 – confirms MySQL injection via measurable time delay
    cve_refs:
    - CVE-2022-0739
    tags:
    - time-based
    - mysql
    - sleep
    - probe
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-time-002
    title: MySQL conditional SLEEP
    payload_string: ''' AND IF(1=1,SLEEP(5),0) --'
    how_it_works: 'The IF() function makes the SLEEP conditional — it only delays if the condition is true. By replacing 1=1
      with a data-extracting condition like ASCII(SUBSTRING(password,1,1))>64, the attacker extracts data one bit at a time
      based on whether the delay occurs. This is the core of time-based blind extraction. Using binary search on ASCII values,
      complete field values can be extracted with logarithmically fewer requests than character-by-character comparison.

      '
    prerequisites:
    - MySQL database
    - Stable network with measurable response times
    waf_bypass_notes: IF(1=1,SLEEP(5),0) combination may be pattern-matched; reorder operands
    severity_context: CVSS 7.5 – conditional time delay for precise data extraction
    cve_refs:
    - CVE-2022-0739
    tags:
    - time-based
    - mysql
    - conditional-sleep
    - data-extraction
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-time-003
    title: PostgreSQL pg_sleep
    payload_string: '''; SELECT pg_sleep(5) --'
    how_it_works: 'PostgreSQL''s pg_sleep(seconds) function delays query execution. When stacked queries are supported, appending
      a SELECT pg_sleep() with a semicolon introduces a measurable delay in the HTTP response. For conditional extraction,
      pg_sleep is wrapped in a CASE WHEN expression: SELECT CASE WHEN (condition) THEN pg_sleep(5) ELSE pg_sleep(0) END. PostgreSQL''s
      precise timing functions make this reliable for data extraction in the absence of visible output channels.

      '
    prerequisites:
    - PostgreSQL database
    - Stacked queries supported or pg_sleep callable in expression context
    waf_bypass_notes: pg_sleep commonly WAF-blocked; use generate_series() as delay alternative
    severity_context: CVSS 7.5 – PostgreSQL time-based blind injection via pg_sleep
    cve_refs: []
    tags:
    - time-based
    - postgresql
    - pg_sleep
    - stacked-query
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-time-004
    title: MSSQL WAITFOR DELAY
    payload_string: '''; WAITFOR DELAY ''0:0:5'' --'
    how_it_works: 'SQL Server''s WAITFOR DELAY statement pauses execution for a specified duration in HH:MM:SS format. Unlike
      MySQL''s SLEEP which is a function, WAITFOR is a statement requiring stacked query support. The time delay is measurable
      from the HTTP response time. Conditional extraction uses: IF condition WAITFOR DELAY ''0:0:5''. This technique is the
      standard time-based blind method for MSSQL and works across all modern SQL Server versions.

      '
    prerequisites:
    - Microsoft SQL Server
    - Stacked queries supported
    waf_bypass_notes: WAITFOR DELAY is a well-known signature; use hex-encoded string 0x303a303a35
    severity_context: CVSS 7.5 – MSSQL time-based blind injection via WAITFOR
    cve_refs: []
    tags:
    - time-based
