    last_updated: '2024-01-01'
  - id: sqli-time-007
    title: Time-based blind in XML/XPath injection
    payload_string: x' or 1=1 or 'x'='y
    how_it_works: 'Some applications use XPath queries with user input in XML-backed databases. Time-based inference can be
      applied to XPath injection by chaining conditions that affect execution time through recursive or complex XPath expressions.
      While true database SLEEP functions are not available in XPath, complex nested queries against large XML documents can
      introduce measurable delays. This technique bridges SQLi timing concepts to XPath injection contexts.

      '
    prerequisites:
    - Application uses XPath queries against XML data
    - User input incorporated into XPath expression
    waf_bypass_notes: XPath injection differs from SQL; standard SQL WAF rules may not apply
    severity_context: CVSS 6.5 – XPath injection with timing inference
    cve_refs: []
    tags:
    - time-based
    - xpath
    - xml
    - non-sql-db
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-time-008
    title: SQLite randomblob heavy query delay
    payload_string: ''' AND 1=(SELECT count(*) FROM (SELECT randomblob(500000000))) --'
    how_it_works: 'SQLite''s randomblob(N) function generates N random bytes. Generating 500MB of random data requires significant
      CPU and memory, introducing a measurable delay. When used in a subquery with count(*), the delay is proportional to
      the blob size. SQLite lacks a dedicated sleep function, making this the primary time-based delay technique for SQLite.
      The count(*) wrapper prevents the large data from being returned as part of the query result, avoiding size-based detection.

      '
    prerequisites:
    - SQLite database
    - Sufficient memory on server for blob generation
    waf_bypass_notes: SQLite-specific; randomblob is not in typical WAF signatures
    severity_context: CVSS 6.5 – SQLite time delay via memory-intensive blob generation
    cve_refs: []
    tags:
    - time-based
