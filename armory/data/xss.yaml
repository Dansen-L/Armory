  - id: xss-poly-010
    title: Unicode normalization bypass
    payload_string: <ſcript>alert(1)</ſcript>
    how_it_works: 'Unicode normalization maps visually similar characters to their canonical ASCII equivalents. The character
      ''ſ'' (U+017F, Latin small letter long s) normalizes to ''s'' under Unicode NFKC normalization. If the application normalizes
      Unicode after checking for the word ''script'', the normalized form becomes a valid script tag. This bypasses filters
      that scan for the literal ASCII word ''script''. The browser receives the normalized form which it executes.

      '
    prerequisites:
    - Application performs Unicode normalization after input validation
    - Filter checks raw input before normalization
    waf_bypass_notes: Effective against applications that normalize Unicode post-validation
    severity_context: CVSS 6.1 – Unicode normalization filter bypass
