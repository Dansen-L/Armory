  - id: xss-poly-011
    title: HTML5 context-agnostic polyglot (onerror + svg)
    payload_string: '''"><svg onload=alert(1)//</svg>'
    how_it_works: 'This short polyglot works across multiple HTML contexts by breaking out of attribute values (using both
      single and double quotes), then injecting an SVG onload handler. The trailing double-slash treats any remaining attribute
      value as a URL comment, preventing parser errors. It functions in reflected GET parameters, form fields, and URL fragments.
      The SVG onload event fires as soon as the element is inserted into the DOM, making this a reliable cross-context probe
      payload. Its brevity makes it useful for WAF bypass testing where character limits apply.

