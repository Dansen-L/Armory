    how_it_works: 'When application code creates elements using createElementNS with incorrect namespace URIs, or when data:
      URIs are used as src/href for navigable elements without restriction, browsers may render the data URI as HTML, executing
      embedded scripts. Navigation to data: URIs from the page context can inherit the page''s origin in some browsers or
      create a new context. This is an advanced technique targeting specific browser behaviors around namespace and URI scheme
      handling.

      '
    prerequisites:
