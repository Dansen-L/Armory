    how_it_works: 'The X-Forwarded-For header is used to pass client IP addresses through proxies and is often logged and
      displayed in analytics, fraud detection, and admin IP tracking systems. Like User-Agent, it is rarely sanitized before
      display. An attacker sending requests with this header set to an XSS payload will trigger blind XSS in any web-based
      system that displays the IP address without encoding. This vector is particularly effective against internal tools that
      are assumed to receive only trusted data.

      '
