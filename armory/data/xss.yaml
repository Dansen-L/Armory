  - id: xss-poly-014
    title: JSON context polyglot breaking out of string and object
    payload_string: '","x":"<script>alert(1)</script>","'
    how_it_works: 'When user input is embedded directly into a JSON object that is later passed to innerHTML or eval(), this
      polyglot closes the current JSON string and object field, then injects a new key containing a script tag. The outer
      application code receives the malformed JSON and may either ignore the parse error and use eval(), or pass the raw string
      to innerHTML. In either case the script tag executes. This technique is particularly relevant for applications that
      inline JSON configuration objects in HTML using server-side templating, where the JSON value is not properly escaped
      for the HTML context.

      '
    prerequisites:
    - User input embedded inside an inline JSON object in HTML
    - JSON object passed to eval() or innerHTML without re-encoding
    waf_bypass_notes: JSON string escapes confuse WAF parsers expecting standard HTML payloads
    severity_context: CVSS 6.1 – JSON string context breakout to XSS
