- slug: mxss
  name: mXSS
  description: Exploits browser DOM parsing mutations that transform seemingly safe HTML into executable XSS payloads, bypassing
    sanitizers that inspect raw markup rather than the parsed DOM.
  difficulty: expert
  prerequisites:
  - Application uses client-side or server-side HTML sanitizer
  - Sanitizer output is re-parsed by the browser (e.g., via innerHTML)
  payloads:
  - id: xss-mxss-001
    title: DOMPurify namespace confusion bypass
    payload_string: <math><mtext></option></select><img src=x onerror=alert(1)></math>
    how_it_works: 'This payload exploits a namespace confusion in the HTML5 parser. The math element switches the parsing
      namespace to MathML, within which certain tags have different semantics. When the sanitizer serializes the cleaned HTML
      and the browser re-parses it, the namespace context may differ, causing the img tag to be interpreted as HTML and execute
      the onerror handler. This type of mutation bypass specifically targets sanitizers that serialize back to string before
      re-parsing, as the serialization/ parse cycle introduces the mutation.

      '
    prerequisites:
    - DOMPurify or similar sanitizer processes the payload
    - Sanitized output reinserted via innerHTML (causing re-parse)
