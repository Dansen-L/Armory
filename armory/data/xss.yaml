    how_it_works: 'Some parsers and filters treat null bytes as string terminators, causing them to stop reading at the null
      byte and missing the rest of the tag name. The browser, however, may strip the null byte during parsing and process
      the element as a valid script tag. This discrepancy between how the filter and the browser interpret the null byte leads
      to filter bypass. This is an encoding-level attack targeting filter implementation details rather than HTML semantics.

      '
