  - id: xss-sto-017
    title: "Stored XSS via htmlspecialchars ENT_COMPAT single-quote bypass"
    payload_string: "' onmouseover='alert(document.cookie)"
    how_it_works: >
      PHP's htmlspecialchars() function encodes <, >, &, and double-quote characters by default
      (ENT_COMPAT mode). It does NOT encode single quotes unless ENT_QUOTES is specified.
      When an application stores user input and reflects it inside a single-quoted HTML attribute
      value — for example <input value='[user_input]'> — the leading single quote in the payload
      closes the attribute, and the injected onmouseover handler executes when the victim hovers
      over the element. Any user who loads the page triggers the stored XSS without a click.
      Affected code pattern: echo "<input value='" . htmlspecialchars($input) . "'>".
    prerequisites:
      - Application uses htmlspecialchars() without ENT_QUOTES flag
      - User-controlled data reflected inside single-quoted HTML attribute value
    waf_bypass_notes: >
      Single-quote payloads bypass WAF rules that block angle brackets and double-quote injection.
      Some WAFs do not flag event-handler keywords (onmouseover, onfocus) inside attribute values.
      URL-encode the single quote as %27 to bypass URL-pattern filters.
    severity_context: "CVSS 6.1 – stored XSS via encoding gap; affects PHP applications using default htmlspecialchars flags"
    cve_refs: []
