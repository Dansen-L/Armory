    last_updated: '2024-01-01'
  - id: xss-dom-006
    title: location.href assignment sink
    payload_string: javascript:alert(1)
    how_it_works: 'When JavaScript assigns a user-controlled value to location.href or window.location, a javascript: URI
      causes the browser to evaluate the URI as code. This happens in applications that redirect users to a URL parameter
      value (e.g., redirect_to= parameters) using client-side JavaScript. The attack requires no HTML injection — only control
      over the value assigned to the location sink. This is also relevant for open redirect chains that include client-side
      location assignment.

      '
    prerequisites:
    - JavaScript assigns URL parameter to location.href without validation
    - 'javascript: scheme not filtered'
    waf_bypass_notes: 'Use &#106;avascript: or java%0ascript: to bypass string checks'
    severity_context: 'CVSS 6.1 – javascript: URI via location assignment sink'
    cve_refs:
    - CVE-2020-11022
    tags:
    - dom-based
    - location-href
    - javascript-uri
    - redirect-sink
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: xss-dom-007
    title: setTimeout/setInterval string argument
    payload_string: ?callback=alert(1)
    how_it_works: 'setTimeout() and setInterval() accept a string as their first argument, which is evaluated as JavaScript
      (equivalent to eval). If application code passes a URL parameter to these functions as a string, arbitrary JavaScript
      executes. This pattern is used in legacy callback-based APIs and polling mechanisms. The vulnerability behaves like
      an eval() sink and allows full JavaScript execution in the page''s origin context.

      '
    prerequisites:
    - Application passes URL parameter to setTimeout() or setInterval() as a string
    - No input sanitization
    waf_bypass_notes: setTimeout string argument is eval-equivalent; not always flagged
    severity_context: CVSS 6.1 – eval-equivalent DOM sink via timer function
    cve_refs:
    - CVE-2020-11023
    tags:
    - dom-based
    - settimeout
    - eval-equivalent
    - callback-abuse
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: xss-dom-008
    title: Prototype pollution to DOM XSS
    payload_string: __proto__[innerHTML]=<img src=x onerror=alert(1)>
    how_it_works: 'Prototype pollution vulnerabilities allow attackers to add properties to JavaScript''s Object.prototype.
      If application code later calls innerHTML on an object derived from the polluted prototype (e.g., element[tainted_key]
      = value), the polluted innerHTML property causes XSS. This is an indirect DOM XSS where the initial injection is via
      prototype pollution and the XSS sink is triggered by normal application code flow. It is a sophisticated multi-step
      attack requiring prototype pollution as a prerequisite.

      '
    prerequisites:
    - Application has a prototype pollution vulnerability
    - Code path later uses a polluted property as a DOM sink
    waf_bypass_notes: Requires prototype pollution chain; high sophistication
    severity_context: CVSS 7.4 – prototype pollution gadget chain leading to XSS
    cve_refs:
    - CVE-2019-11358
    tags:
    - dom-based
