  - id: xss-dom-013
    title: document.referrer injection
    payload_string: <script>alert(1)</script>
    how_it_works: 'Applications that display ''You came from: [referrer]'' messages by reading document.referrer and inserting
      it into innerHTML are vulnerable. An attacker crafts an HTML page on an attacker-controlled domain that contains a script
      tag payload as part of the URL path or query, then places a link to the vulnerable page. When the victim navigates from
      the attacker''s page, document.referrer contains the malicious URL which is then executed via innerHTML. The payload
      must survive URL-encoding of the referrer value.

      '
    prerequisites:
