  - id: xss-dom-011
    title: Cookie value DOM XSS
    payload_string: <img src=x onerror=alert(1)>
    how_it_works: 'When client-side JavaScript reads a cookie value and places it into an unsafe DOM sink such as innerHTML,
      an attacker who can set cookies (via a subdomain, MITM, or XSS chain) can trigger DOM XSS. This is particularly relevant
      when cookies set by subdomains are readable by the main domain. The attack chain involves first setting a malicious
      cookie value and then waiting for the JavaScript to read and render it.

      '
    prerequisites:
    - JavaScript reads a cookie and inserts its value into innerHTML
    - Attacker can set cookies on the domain or subdomain
    waf_bypass_notes: Cookie source is not a typical WAF inspection point
    severity_context: CVSS 6.1 – cookie-based DOM XSS
