    how_it_works: 'This advanced blind XSS payload not only captures cookies but also exfiltrates the first 5000 characters
      of the page''s DOM where execution occurred. This reveals the admin interface structure, other users'' data, CSRF tokens,
      and API keys visible in the page. The POST request avoids query string length limits. JSON serialization handles special
      characters. Combined with OOB infrastructure, this gives the attacker a complete snapshot of the privileged context
      in which the XSS fired.

      '
    prerequisites:
