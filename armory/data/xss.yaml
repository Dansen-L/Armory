  - id: xss-poly-013
    title: URL-encoded polyglot for query parameter injection
    payload_string: '%22%3E%3Cscript%3Ealert(document.domain)%3C/script%3E'
    how_it_works: 'URL percent-encoding of the payload ''<script>alert(document.domain)</script>'' allows it to bypass WAF
      rules that scan for literal angle brackets and script keywords in query strings. When the server URL-decodes the parameter
      before reflecting it in HTML without encoding, the decoded payload injects a script tag. The document.domain output
      confirms the exploited origin, useful for demonstrating the impact to customers. This encoding-bypass technique is fundamental
      to reflected XSS testing on applications that apply WAF filtering before URL decoding but skip HTML encoding on output.

      '
    prerequisites:
    - Server URL-decodes query parameters before HTML-encoding for output
    - WAF inspects URL-encoded form but does not re-check after decoding
    waf_bypass_notes: Double URL-encoding or mixed encoding may be needed against aggressive WAFs
