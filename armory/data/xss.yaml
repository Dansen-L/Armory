  - id: xss-dom-009
    title: Open redirect to DOM XSS via referrer
    payload_string: https://victim.com/redirect?url=https://attacker.com/xss.html
    how_it_works: 'Some applications read document.referrer to redirect or display content after a navigation. An attacker
      can craft a page on attacker.com that reads the referrer and uses it as an XSS payload. If victim.com reads document.referrer
      and passes it to an unsafe sink, the attacker page''s URL becomes the referrer. This two-step attack chains an open
      redirect with DOM XSS. The attacker first sends the victim to their page then redirects to the vulnerable referrer-reading
      page.

      '
    prerequisites:
    - Page reads document.referrer and uses it in unsafe sink
    - Attacker can control referrer (typically via open redirect chain)
    waf_bypass_notes: Referrer-based DOM XSS is rarely in WAF rules
