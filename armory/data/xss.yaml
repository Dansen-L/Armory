  - id: xss-dom-014
    title: JSON.parse eval gadget
    payload_string: '{"__proto__":{"innerHTML":"<img src=x onerror=alert(1)>"}}'
    how_it_works: 'Some implementations use JSON.parse on user input and then spread or merge the result into objects. If
      the parsed JSON is merged using a vulnerable Object.assign or similar and later properties from that object are used
      as innerHTML values, a prototype pollution chain leads to DOM XSS. The __proto__ key in JSON poisons Object.prototype''s
      innerHTML, which is then used by application code as a DOM insertion method.

      '
