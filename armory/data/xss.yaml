  - id: xss-dom-012
    title: localStorage DOM XSS
    payload_string: <img src=x onerror=alert(document.cookie)>
    how_it_works: 'If an application stores user-controlled data in localStorage and later reads it back into an unsafe DOM
      sink, an attacker who achieves any XSS (even low-impact) can plant a persistent payload in localStorage. On subsequent
      visits, the application reads the malicious value and executes it via innerHTML or similar. This creates a persistent
      self-healing XSS that survives page refreshes and new sessions, effectively turning a reflected XSS into a stored-like
      persistent XSS.

      '
    prerequisites:
    - Application stores data in localStorage from user input
    - localStorage value later read into unsafe DOM sink
    waf_bypass_notes: localStorage source bypasses all server-side inspection
    severity_context: CVSS 7.4 – persistent client-side storage to DOM XSS
