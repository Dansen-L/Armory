  - id: xss-poly-015
    title: Event handler polyglot for multiple HTML attribute contexts
    payload_string: x onmouseover=alert(1) onfocus=alert(1) onclick=alert(1) x=
    how_it_works: 'This polyglot injects multiple event handlers simultaneously by crafting input that, when inserted into
      an HTML attribute value or tag context, adds three independent event handlers. The trailing x= fragment starts a new
      attribute without a value, consuming whatever the server appends next and preventing HTML parse errors. The three event
      handlers (mouseover, focus, click) maximise the chance of execution across different page interaction patterns. This
      is used as a comprehensive attribute-injection probe during penetration tests because it tests multiple browser event
      triggers with one request, reducing the number of test cases needed to confirm XSS exploitability.

      '
