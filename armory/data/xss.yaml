  - id: xss-dom-010
    title: WebSocket message DOM XSS
    payload_string: <script>alert(1)</script>
    how_it_works: 'WebSocket applications that receive messages and insert them directly into the DOM using innerHTML or outerHTML
      are vulnerable to DOM XSS via WebSocket injection. If an attacker can inject messages into the WebSocket stream (via
      MITM on non-WSS connections, or via a malicious WebSocket server in SSRF chains), they can deliver XSS payloads to all
      connected clients. This is a high-impact vector in real-time applications like chats or live dashboards.

      '
    prerequisites:
