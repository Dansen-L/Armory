- slug: dom-based
  name: DOM-based XSS
  description: The vulnerability exists entirely in client-side JavaScript that reads from attacker-controllable sources (location.hash,
    document.referrer) and writes to dangerous sinks (innerHTML, eval).
  difficulty: high
  prerequisites:
  - Client-side JavaScript reads from a tainted source
  - Tainted data flows to a dangerous sink without sanitization
  payloads:
  - id: xss-dom-001
    title: Hash fragment innerHTML sink
    payload_string: '#<img src=x onerror=alert(1)>'
    how_it_works: 'If JavaScript reads location.hash and assigns it to an element''s innerHTML, anything in the URL fragment
      becomes HTML in the DOM. The hash is never sent to the server, making this XSS invisible to server-side logs and WAFs.
      The attacker crafts a URL with this hash value and sends it to a victim. The victim''s browser executes the img onerror
      payload. This is a purely client-side attack with no server interaction required.

      '
    prerequisites:
    - JavaScript assigns location.hash to innerHTML
    - No sanitization of hash value
    waf_bypass_notes: Hash fragment not visible to server or WAF; undetectable server-side
    severity_context: CVSS 6.1 – client-side only, invisible to server logs
    cve_refs:
    - CVE-2020-11022
    tags:
    - dom-based
    - location-hash
    - innerhtml-sink
    - waf-bypass
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: xss-dom-002
    title: document.write with location.search
    payload_string: ?q=<script>alert(1)</script>
    how_it_works: 'When JavaScript uses document.write() with data from location.search (the URL query string), the written
      content is parsed as HTML by the browser. document.write operates during page load and can modify the document stream,
      making injected script tags execute immediately. Because document.write is a synchronous DOM sink, there is no opportunity
      for async sanitization. This pattern is common in older web analytics and search result pages.

      '
    prerequisites:
    - JavaScript calls document.write() with location.search data
    - No output encoding applied to query string data
    waf_bypass_notes: WAF may block obvious payloads; use double encoding or DOM fragments
    severity_context: CVSS 6.1 – DOM write sink in legacy JavaScript pattern
    cve_refs: []
    tags:
    - dom-based
    - document-write
    - location-search
    - legacy
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: xss-dom-003
    title: eval() with postMessage data
    payload_string: alert(1)
    how_it_works: 'When a page receives postMessage events and passes the message data to eval() without origin verification,
      any page on the internet can send malicious messages. An attacker opens the vulnerable page in an iframe or popup, then
      sends a postMessage containing JavaScript code. The vulnerable page''s message handler evaluates it, executing in the
      target page''s origin. Missing origin checks in addEventListener(''message'') handlers is the root cause.

      '
    prerequisites:
    - Page has addEventListener('message') that passes data to eval() or innerHTML
    - No origin check (event.origin not validated)
    waf_bypass_notes: Attack originates from attacker page; no HTTP request to target server
    severity_context: CVSS 7.4 – cross-origin code execution via postMessage abuse
    cve_refs:
    - CVE-2020-11023
    tags:
    - dom-based
    - postmessage
    - eval-sink
    - cross-origin
    - advanced
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: xss-dom-004
    title: jQuery html() sink
    payload_string: ?msg=<img src=x onerror=alert(1)>
    how_it_works: 'jQuery''s .html() method sets innerHTML directly without sanitization. When applications use $(selector).html(location.search.substring(5))
      or similar patterns to display URL parameters in the page, the parameter becomes an HTML sink. This is extremely common
      in jQuery-heavy legacy applications. The img onerror fires immediately upon insertion. Any jQuery version below 3.5.0
      is particularly vulnerable to this pattern.

      '
    prerequisites:
    - Application uses jQuery .html() with URL parameter data
    - jQuery version below 3.5.0 or no additional sanitization
    waf_bypass_notes: Client-side jQuery sink; server-side WAF may not inspect this vector
    severity_context: CVSS 6.1 – jQuery DOM sink XSS, very common in legacy apps
    cve_refs:
    - CVE-2019-11358
    tags:
    - dom-based
    - jquery
    - html-sink
    - legacy
    - common
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: xss-dom-005
    title: Angular template injection (client-side)
    payload_string: '{{constructor.constructor(''alert(1)'')()}}'
    how_it_works: 'AngularJS template injection occurs when user input is placed inside Angular template expressions without
      sanitization. The double curly brace syntax evaluates as an Angular expression. By accessing the constructor property
      chain, an attacker can obtain the Function constructor and call it with arbitrary JavaScript, bypassing Angular''s sandbox.
      This affects AngularJS (1.x) applications where template expressions are evaluated client-side. Multiple sandbox escapes
      exist for different AngularJS versions.

      '
    prerequisites:
    - Application uses AngularJS (1.x) template expressions
    - User input injected into Angular-controlled HTML
    waf_bypass_notes: Angular-specific; bypass varies by version; see dedicated SSTI payloads
    severity_context: CVSS 7.4 – Angular sandbox escape leading to JavaScript execution
    cve_refs: []
