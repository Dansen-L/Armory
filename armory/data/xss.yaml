  - id: xss-poly-012
    title: 'Jaff polyglot: valid JS, CSS, and HTML'
    payload_string: /*</style></script><img src=/ onerror=alert(1)>*/
    how_it_works: 'This polyglot is simultaneously valid as a JavaScript block comment, a CSS block comment, and an HTML element
      that triggers XSS. When placed in a JavaScript context, the parser ignores everything inside the /* ... */ comment.
      In a CSS context it similarly acts as a comment block. However, if the output is placed in an HTML context (for example,
      when server-side rendering inserts the value into a page), the img tag''s onerror fires. The multi-language validity
      makes it an effective probe for applications that pre-process content through multiple languages before final HTML rendering.
      A single payload tests JS injection, CSS injection, and HTML injection simultaneously.

      '
    prerequisites:
    - 'Input appears in at least one of: HTML, JavaScript, or CSS context'
    - No context-specific encoding applied to both comment delimiters
    waf_bypass_notes: JS/CSS comment wrapper confuses content-type-aware WAF engines
    severity_context: CVSS 6.1 – multi-language context-agnostic XSS polyglot
