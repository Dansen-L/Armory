    how_it_works: 'Markdown renderers that allow javascript: URIs in link syntax can produce clickable XSS payloads when the
      output is displayed in an admin comment thread or moderation panel. The attacker posts a comment with a crafted markdown
      link; when an administrator clicks or hovers over the rendered link, the javascript: handler executes in their browsing
